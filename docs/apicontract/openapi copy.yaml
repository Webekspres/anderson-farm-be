    delete:
      tags: [Setup]
      summary: Cabut alat fisik dari kandang
      description: Mencabut alat fisik (unit_code) dari kandang.

  /api/v1/periods:
    post:
      tags: [Setup]
      summary: Inisiasi periode ternak
      description: Inisiasi kerangka Periode Ternak baru.
    put:
      tags: [Setup]
      summary: Edit periode ternak
      description: Edit kerangka Periode Ternak.

  /api/v1/periods/{id}/investors:
    post:
      tags: [Setup]
      summary: Assign investor ke periode
      description: Menugaskan persentase bagi hasil Investor di periode.

  /api/v1/periods/{id}/checklist-tasks:
    post:
      tags: [Setup]
      summary: Generate checklist tugas periode
      description: Generate daftar SOP/tugas (Boolean/Text) khusus periode ini.

  /api/v1/periods/{id}/form-assignments:
    post:
      tags: [Setup]
      summary: Assign form HBE ke periode
      description: Mengaitkan pertanyaan HBE spesifik khusus periode ini.

  /api/v1/periods/{id}/contracts:
    post:
      tags: [Setup]
      summary: Simpan kontrak bagi hasil periode
      description: Menyimpan JSON URL kontrak bagi hasil untuk disetujui ABK.

  /api/v1/periods/{id}/documents:
    post:
      tags: [Setup]
      summary: Simpan dokumen periode
      description: Menyimpan JSON URL file jadwal/dokumen khusus periode tersebut.

  /api/v1/periods/{id}/rhpp-documents:
    post:
      tags: [Setup]
