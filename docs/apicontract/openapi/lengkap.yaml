          $ref: '#/paths/~1api~1v1~1areas/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/403'
  '/api/v1/periods/{id}/checklist-tasks':
    post:
      tags:
        - Setup - Checklist Task
      summary: Generate checklist tugas periode
      description: |
        Membuat daftar tugas harian (SOP/To-Do List) untuk periode tertentu.
        Payload berupa array of objects (nama tugas, tipe, deskripsi opsional).
        Validasi:
          - period_id harus valid (ada di production_periods)
          - task_name wajib diisi, unik per periode
          - task_type wajib BOOLEAN atau TEXT
        Data akan disimpan ke tabel checklist_tasks dan diikat ke ID periode.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - task_name
                  - task_type
                properties:
                  task_name:
                    type: string
                    example: Periksa klorin air minum
                    description: Nama tugas (unik per periode)
                  task_type:
                    description: 'Jenis tugas (BOOLEAN = centang, TEXT = isian)'
                    type: string
                    enum:
                      - BOOLEAN
                      - TEXT
                  description:
                    type: string
