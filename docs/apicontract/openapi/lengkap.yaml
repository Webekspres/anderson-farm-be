                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v1~1notifications~1%7Bid%7D~1read/patch/responses/200/content/application~1json/schema'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 1
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
  '/api/v1/notifications/{id}/read':
    patch:
      tags:
        - System - Notifications
      summary: Tandai notifikasi dibaca
      description: |
        Mengubah status 'read_at' pada notifikasi spesifik.
        Menggunakan PATCH karena hanya melakukan update parsial pada satu kolom.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Notifikasi berhasil ditandai sebagai dibaca.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                      - type: object
                        properties:
                          title:
                            type: string
                            example: Tugas Terlewat!
                            description: Judul notifikasi.
                          message:
                            type: string
                            example: Anda belum mengisi laporan harian untuk Kandang Arwana 1.
                            description: Isi pesan notifikasi.
                          type:
                            type: string
                            enum:
                              - INFO
                              - WARNING
                              - ANNOUNCEMENT
                              - SYSTEM
                            example: WARNING
                            description: Kategori notifikasi untuk menentukan icon di aplikasi mobile.
                          read_at:
                            type:
                              - string
                              - 'null'
                            format: date-time
                            example: null
                            description: Timestamp kapan notifikasi dibaca (null jika belum dibaca).
                      - $ref: '#/components/schemas/FarmResponse/properties/data/allOf/1'
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v1~1uploads/delete/responses/404'
  /api/v1/sync/master-data:
    get:
      tags:
        - Sync
      summary: Sync master data offline
      description: |
        Mengunduh seluruh cache referensi dasar (Master Data) untuk operasional offline.
        Data yang dikirimkan mencakup hierarchy kandang, konfigurasi form, dan master item.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: last_sync_at
          schema:
            type: string
            format: date-time
          description: 'Timestamp sinkronisasi terakhir. Jika diisi, server hanya mengirim data yang diperbarui (updated_at_server > last_sync_at).'
      responses:
        '200':
          description: Berhasil menarik data sinkronisasi master.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Objek berisi kumpulan array data referensi.
                    properties:
                      areas:
                        type: array
                        items:
                          $ref: '#/components/schemas/AreaResponse'
                      farms:
                        type: array
                        items:
                          $ref: '#/components/schemas/FarmResponse'
                      coops:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoopResponse'
                      coop_documents:
                        type: array
                        items:
                          $ref: '#/paths/~1api~1v1~1coops~1%7Bid%7D~1documents/post/responses/201/content/application~1json/schema'
                      ovk_items:
                        type: array
                        items:
                          $ref: '#/paths/~1api~1v1~1ovk-items/post/responses/201/content/application~1json/schema'
                      equipment_types:
                        type: array
                        items:
                          $ref: '#/paths/~1api~1v1~1equipment-types/post/responses/201/content/application~1json/schema'
                      form_configs:
                        type: array
                        items:
                          $ref: '#/paths/~1api~1v1~1form-configs/post/responses/201/content/application~1json/schema'
                      transaction_categories:
                        type: array
                        items:
                          $ref: '#/paths/~1api~1v1~1transaction-categories/post/responses/201/content/application~1json/schema'
                      report_templates:
                        type: array
                        items:
                          $ref: '#/paths/~1api~1v1~1report-templates/post/responses/201/content/application~1json/schema'
                  server_time:
                    type: string
                    format: date-time
                    description: Waktu server saat ini (digunakan mobile sebagai 'last_sync_at' berikutnya).
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
  /api/v1/sync/periods:
