  /api/v1/sync/daily-activities:
    get:
      tags:
        - Sync - Activities
      summary: Delta Sync (Pull) Laporan Harian
      description: Mengambil data aktivitas harian yang diperbarui di server sejak sinkronisasi terakhir.
      security:
        - sanctum: []
      parameters:
        - name: period_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: last_sync_timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Diambil dari tabel sync_trackers lokal.
      responses:
        '200':
          description: Daftar aktivitas harian terbaru berhasil ditarik.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  current_server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/paths/~1api~1v1~1sync~1daily-activities/post/requestBody/content/application~1json/schema/properties/activities/items'
                        - $ref: '#/components/schemas/FarmResponse/properties/data/allOf/1'
    post:
      tags:
        - Sync - Activities
      summary: Bulk Sync (Push) Laporan Harian
      description: Mengirim data aktivitas harian yang dibuat secara offline ke server.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sync_timestamp
                - activities
              properties:
                sync_timestamp:
                  type: string
                  format: date-time
                activities:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/FarmRequest/allOf/0'
                      - type: object
                        required:
                          - period_id
                          - user_id
                          - date
                          - age_days
                        properties:
                          period_id:
                            type: string
                            format: uuid
                          user_id:
                            type: string
                            format: uuid
                          date:
                            type: string
                            format: date-time
                            example: '2026-04-24T00:00:00Z'
                          age_days:
                            type: integer
                            example: 14
                          mortality_count:
                            type: integer
                            default: 0
                          cull_count:
                            type: integer
                            default: 0
                          average_weight:
                            type: ["number", "null"]
                            format: float
                          business_status:
                            type: string
                            enum:
                              - DRAFT
                              - SUBMITTED
                              - APPROVED
                              - REJECTED
                              - NEEDS_REVIEW
                            default: DRAFT
                          rejection_reason:
                            type: ["string", "null"]
                      - type: object
                        properties:
                          dynamic_logs:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                form_config_id:
                                  type: string
                                  format: uuid
                                value:
                                  type: string
                                created_at_client:
                                  type: string
                                  format: date-time
                          dailyChecklistLogs:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                task_id:
                                  type: string
                                  format: uuid
                                boolean_value:
                                  type: ["boolean", "null"]
                                text_value:
                                  type: ["string", "null"]
                                notes:
                                  type: ["string", "null"]
                                created_at_client:
                                  type: string
                                  format: date-time
                          ovk_usages:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                ovk_item_id:
                                  type: string
                                  format: uuid
                                quantity:
                                  type: number
                                  format: float
                                notes:
                                  type: ["string", "null"]
                                created_at_client:
                                  type: string
                                  format: date-time
      responses:
        '201':
          description: Sinkronisasi berhasil diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      sync_results:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: UUID Client
                            status:
                              type: string
                              enum:
                                - SUCCESS
                                - CONFLICT
                                - ERROR
                            server_id:
                              type: ["string", "null"]
