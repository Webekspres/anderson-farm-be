  /api/v1/uploads:
    post:
      tags:
        - Files
      summary: Upload file fisik
      description: |
        Unggah file fisik (PDF/JPG/PNG) secara multipart.
        Mengembalikan URL dan Path Lokal yang nantinya akan disisipkan sebagai JSON ke endpoint setup/master data (seperti contracts, documents, atau photos).
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - folder
              properties:
                file:
                  type: string
                  format: binary
                  description: File fisik yang akan diunggah (Max 5MB).
                folder:
                  type: string
                  enum:
                    - contracts
                    - documents
                    - rhpp
                    - photos
                    - sop
                  description: Kategori direktori penyimpanan agar file server rapi.
                  example: contracts
      responses:
        '201':
          description: File berhasil diunggah
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: File berhasil diunggah.
                  data:
                    type: object
                    properties:
                      file_url:
                        type: string
                        format: uri
                        description: URL publik/signed untuk mengakses file (Bisa disimpan di database mobile).
                        example: 'https://api.andersonfarm.com/storage/contracts/doc-123.pdf'
                      file_path_local:
                        type: string
                        description: Path internal server untuk keperluan delete atau pemindahan file.
                        example: contracts/doc-123.pdf
                      file_type:
                        type: string
                        description: Ekstensi file yang terdeteksi.
                        example: pdf
        '400':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/403'
        '413':
          description: Ukuran file melebihi batas maksimum
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1users/get/responses/401/content/application~1json/schema'
              example:
                success: false
                message: Ukuran file terlalu besar. Maksimum 5MB.
                errors:
                  file:
                    - File size exceeds the 5MB limit.
    delete:
      tags:
        - Files
      summary: Hapus file fisik
      description: |
        Menghapus file fisik dari storage server (S3/Local).
        Digunakan untuk menghapus file orphaned jika user sudah berhasil upload namun batal menekan tombol simpan/submit di form utama.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: file_path_local
          required: true
          schema:
            type: string
            example: contracts/doc-123.pdf
          description: Path file di server yang ingin dihapus (didapat dari response saat upload).
      responses:
        '200':
          description: Operasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1sync~1rhpps/get/responses/200/content/application~1json/schema'
        '400':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
        '404':
          description: Resource tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1users/get/responses/401/content/application~1json/schema'
              example:
                success: false
                message: Data tidak ditemukan di sistem.
                errors: {}
