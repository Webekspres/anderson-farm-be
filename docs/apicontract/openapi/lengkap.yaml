components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
      example: 1
    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    CursorParam:
      name: cursor
      in: query
      description: 'Cursor untuk pagination berbasis cursor. Jika tidak diisi, akan mulai dari awal.'
      required: false
      schema:
        type: string
      example: cursor-uuid-1234
    LimitParam:
      name: limit
      in: query
      description: Jumlah data per page (pagination berbasis cursor)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID dari resource yang dituju.
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      properties:
        username:
          type: string
          minLength: 4
        password:
          type: string
          format: password
          minLength: 8
        device_id:
          type: string
          description: UUID unik perangkat yang digunakan login
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT token untuk autentikasi selanjutnya
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        data:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: ID unik user (UUID atau numeric)
          example: user-uuid-1234
        username:
          type: string
          example: budi_abk1
        name:
          type: string
          description: Nama lengkap user
          example: Budi Santoso
        role:
          type: string
          enum:
            - admin
            - finance
            - manager
            - pic
            - abk
            - investor
        phone:
          type: string
          description: Nomor HP user
          example: '+628123456789'
        email:
          type: string
          format: email
          example: budi@andersonfarm.id
        device_id:
          type: string
          description: UUID perangkat yang terdaftar (jika sudah binding)
          example: android-uuid-xxx-yyy
        coop_assignments:
          type: array
          description: Daftar kandang yang diassign ke user (jika ada)
          items:
            type: object
            properties:
              coop_id:
                type: string
                description: ID kandang
                example: coop-uuid-1234
              coop_name:
                type: string
                description: Nama kandang
                example: Kandang A1
        is_active:
          type: boolean
          description: Status aktif user
          example: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-10T12:00:00Z'
    FcmTokenRequest:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string
          description: Token unik yang dihasilkan oleh Firebase Cloud Messaging di perangkat.
          example: fcm_token_xyz_123...
        device_name:
          type: string
          description: Nama opsional perangkat untuk identifikasi log.
          example: Samsung S24 - Android 14
    ForgotPasswordRequest:
      type: object
      required:
        - username
        - via
      properties:
        username:
          type: string
          description: Username user yang ingin reset password
          example: budi_abk1
        via:
          type: string
          description: Media pengiriman OTP/link (email/wa)
          enum:
            - email
            - wa
          example: email
    ResetPasswordRequest:
      type: object
      required:
        - username
        - otp
        - new_password
      properties:
        username:
          type: string
          description: Username user
          example: budi_abk1
        otp:
          type: string
          description: Kode OTP yang diterima user
          example: '123456'
        new_password:
          type: string
          format: password
          minLength: 8
          description: Password baru user
          example: PasswordBaru123!
    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - name
        - role
      properties:
        username:
          type: string
          minLength: 4
          description: Username unik user
          example: budi_abk1
        password:
          type: string
          format: password
          minLength: 8
          description: Password user (akan di-hash)
          example: RahasiaPassword123!
        name:
          type: string
          description: Nama lengkap user
          example: Budi Santoso
        email:
          type: string
          format: email
          description: Email user (opsional)
          example: budi@andersonfarm.id
        phone:
          type: string
          description: Nomor HP user (opsional)
          example: '+628123456789'
        role:
          $ref: '#/components/schemas/UserResponse/properties/role'
    FarmBase:
      type: object
      required:
        - area_id
        - name
        - address
      properties:
        area_id:
          type: string
          format: uuid
          description: ID Area induk farm ini.
        name:
          type: string
          example: Farm Bandung Selatan
        address:
          type: string
          example: 'Jl. Raya Soreang No. 1, Bandung'
        is_active:
          type: boolean
          default: true
          example: true
    FarmRequest:
      allOf:
        - type: object
          required:
            - id
            - created_at_client
            - updated_at_client
          properties:
            id:
              type: string
              format: uuid
              description: UUID lokal dari SQLite.
            created_at_client:
              type: string
              format: date-time
            updated_at_client:
              type: string
              format: date-time
        - $ref: '#/components/schemas/FarmBase'
    FarmResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/FarmRequest'
            - type: object
              properties:
                server_id:
                  type: integer
                  example: 1
                version:
                  type: integer
                  default: 1
                sync_status:
                  type: string
                  enum:
                    - SYNCED
                    - CONFLICT
                created_at_server:
                  type: string
                  format: date-time
                updated_at_server:
                  type: string
                  format: date-time
                deleted_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
    UserListData:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: user-uuid-1234
              username:
                type: string
                example: budi_abk1
              name:
                type: string
                example: Budi Santoso
              role:
                $ref: '#/components/schemas/UserResponse/properties/role'
              email:
                type: string
                format: email
                example: budi@andersonfarm.id
              phone:
                type: string
                example: '+628123456789'
              is_active:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: '2024-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-10T12:00:00Z'
    UserListResponse:
      type: object
      description: Response daftar user dengan dukungan pagination page/limit atau cursor.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Daftar user berhasil diambil.
        data:
          allOf:
            - $ref: '#/components/schemas/UserListData'
            - oneOf:
                - type: object
                  description: Metadata untuk pagination berbasis page/limit
                  properties:
                    total:
                      type: integer
                      example: 2
                    per_page:
                      type: integer
                      example: 10
                    current_page:
                      type: integer
                      example: 1
                    last_page:
                      type: integer
                      example: 1
                - type: object
                  description: Metadata untuk pagination berbasis cursor
                  properties:
                    next_cursor:
                      type:
                        - string
                        - 'null'
                      example: cursor-uuid-1234
                    prev_cursor:
                      type:
                        - string
                        - 'null'
                      example: null
                    has_next:
                      type: boolean
                      example: true
                    has_prev:
                      type: boolean
                      example: false
    AreaBase:
      type: object
      required:
        - name
        - manager_id
      properties:
        name:
          type: string
          example: Area Jawa Barat
        manager_id:
          type: string
          format: uuid
          description: ID User dengan role Manager.
    AreaRequest:
      allOf:
        - $ref: '#/components/schemas/FarmRequest/allOf/0'
        - $ref: '#/components/schemas/AreaBase'
    AreaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/AreaRequest'
            - $ref: '#/components/schemas/FarmResponse/properties/data/allOf/1'
    CoopBase:
      type: object
      required:
        - farm_id
        - name
        - capacity
        - floor
        - coop_type
      properties:
        farm_id:
          type: string
          format: uuid
          description: ID Farm induk kandang ini.
        name:
          type: string
          example: Kandang A1
        capacity:
          type: integer
          example: 10000
        floor:
          type: integer
          example: 1
        coop_type:
          type: string
          enum:
            - open_house
            - closed_house
        note:
          oneOf:
            - type: string
            - type: 'null'
          example: Kandang utama untuk starter
        is_active:
          type: boolean
          default: true
          example: true
    CoopRequest:
      allOf:
        - $ref: '#/components/schemas/FarmRequest/allOf/0'
        - $ref: '#/components/schemas/CoopBase'
    CoopResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/CoopRequest'
            - $ref: '#/components/schemas/FarmResponse/properties/data/allOf/1'
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - ApiKey: []
