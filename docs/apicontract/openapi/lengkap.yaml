        - in: query
          name: platform
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
          description: Sistem operasi perangkat agar server bisa memberikan download_url yang tepat.
      responses:
        '200':
          description: Berhasil mendapatkan info versi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      latest_version:
                        type: string
                        example: 1.2.0
                        description: Versi terbaru aplikasi di server.
                      is_update_required:
                        type: boolean
                        example: true
                        description: True jika versi app_version user lebih rendah dari latest_version.
                      is_force_update:
                        type: boolean
                        example: true
                        description: True jika user WAJIB update (tidak bisa skip/tutup modal). Biasanya karena ada perubahan skema database lokal (offline-first).
                      download_url:
                        type: string
                        format: uri
                        example: 'https://play.google.com/store/apps/details?id=com.andersonfarm.app'
                        description: Link menuju Play Store / App Store atau link file APK langsung.
                      release_notes:
                        type: string
                        example: Perbaikan fitur sinkronisasi RHPP dan penambahan modul absensi.
                        description: Catatan pembaruan untuk ditampilkan di layar Splash.
        '400':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/400'
  /api/v1/notifications:
