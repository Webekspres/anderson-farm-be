  /api/v1/periods:
    post:
      tags:
        - Setup - Period
      summary: Inisiasi periode ternak
      description: |
        Membuat kerangka Periode Ternak baru (production_periods).
        Validasi:
          - coop_id harus valid dan belum memiliki periode aktif lain.
          - pic_id harus user dengan role PIC.
        Satu kandang (coop_id) tidak boleh memiliki lebih dari satu periode dengan status active.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FarmRequest/allOf/0'
                - type: object
                  required:
                    - coop_id
                    - pic_id
                    - period_code
                    - start_date
                    - initial_stock
                  properties:
                    coop_id:
                      type: string
                      format: uuid
                      example: coop-uuid
                      description: 'ID kandang (harus valid, tidak boleh punya periode aktif lain)'
                    pic_id:
                      type: string
                      format: uuid
                      example: user-uuid
                      description: ID PIC (user dengan role PIC)
                    period_code:
                      type: string
                      example: PER-2026-001
                      description: Kode unik periode
                    start_date:
                      type: string
                      format: date-time
                      example: '2026-04-10T10:00:00Z'
                      description: Tanggal mulai periode
                    end_date:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      example: null
                      description: Tanggal selesai periode (opsional)
                    initial_stock:
                      type: integer
                      example: 10000
                      description: Populasi awal DOC
                    closing_reason:
                      type:
                        - string
                        - 'null'
                      example: null
                      description: Alasan penutupan periode (opsional)
                    status:
                      type: string
                      enum:
                        - active
                        - closed
                      example: active
                      description: Status periode
      responses:
        '201':
          description: Periode ternak berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1periods/put/responses/200/content/application~1json/schema'
        '400':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/403'
    put:
      tags:
        - Setup - Period
      summary: Edit periode ternak
      description: |
        Mengedit metadata periode ternak (misal: initial_stock, start_date).
        Endpoint ini harus dikunci jika umur ayam sudah melebihi hari tertentu (tidak bisa diedit jika sudah berjalan lama).
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FarmRequest/allOf/0'
                - type: object
                  required:
                    - period_code
                  properties:
                    period_code:
                      type: string
                      example: PER-2026-001
                    start_date:
                      type: string
                      format: date-time
                      example: '2026-04-10T10:00:00Z'
                    end_date:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      example: null
                    initial_stock:
                      type: integer
                      example: 10000
                    closing_reason:
                      type:
                        - string
                        - 'null'
                      example: null
      responses:
        '200':
          description: Periode ternak berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - $ref: '#/paths/~1api~1v1~1periods/post/requestBody/content/application~1json/schema'
                      - $ref: '#/components/schemas/FarmResponse/properties/data/allOf/1'
        '400':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1areas/post/responses/403'
  '/api/v1/periods/{id}/investors':
    post:
      tags:
        - Setup - Period Investor
      summary: Assign investor ke periode
      description: |
        Menentukan siapa saja yang menanam modal dan berapa jatah kue (laba) mereka.
        Menerima array atau satu per satu ID investor beserta profit_share_percentage.
        Validasi:
          - user_id harus user dengan role investor.
          - Total profit_share_percentage untuk periode ini tidak boleh melebihi 100%.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - user_id
                  - profit_share_percentage
                properties:
                    user_id:
                      type: string
                      format: uuid
                      example: user-uuid-investor
                      description: ID user investor (role harus investor)
                    profit_share_percentage:
                      type: number
                      format: float
                      example: 20.5
                      description: 'Persentase bagi hasil investor (0-100, total semua investor ≤ 100)'
                    initial_investment:
                      type: number
                      format: float
                      example: 10000000
                      description: Modal awal yang disetor (opsional)
      responses:
        '201':
          description: Investor berhasil diassign ke periode
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [user_id, profit_share_percentage]
                      properties:
                        user_id:
                          type: string
                          format: uuid
                          example: "user-uuid-investor"
                          description: ID user investor (role harus investor)
                        profit_share_percentage:
                          type: number
                          format: float
                          example: 20.5
                          description: Persentase bagi hasil investor (0-100, total semua investor ≤ 100)
                        initial_investment:
                          type: number
                          format: float
                          example: 10000000
                          description: Modal awal yang disetor (opsional)
