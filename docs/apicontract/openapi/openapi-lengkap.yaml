  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Validasi gagal (input tidak valid)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Input tidak valid.
            errors:
              name:
                - Field ini wajib diisi.
    UnauthorizedError:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Token tidak valid atau kadaluarsa.
            errors: {}
    ForbiddenError:
      description: Forbidden (tidak punya akses role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Anda tidak memiliki hak akses.
            errors: {}
    NotFoundError:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Data tidak ditemukan di sistem.
            errors: {}
    GeneralResponse:
      description: Response umum untuk operasi yang tidak mengembalikan data spesifik, hanya status sukses dan pesan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeneralResponse"
          example:
            success: true
            message: Operasi berhasil dilakukan.
            data: null
      # type: object
      # properties:
      #   success:
      #     type: boolean
      #     example: true
      #   message:
      #     type: string
      #     example: Operation successful
      #   data:
      #     type: object
      #     description: Field tambahan jika diperlukan di masa depan. Bisa berupa objek atau null.
