openapi: 3.1.0
info:
  version: 1.0.0
  title: Anderson Farm API
  description: API sistem manajemen pertanian offline-first untuk Anderson Farm
security:
  - ApiKey: []
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login & Device Binding.
      description: Login dan mengunci akun ke 1 perangkat (device binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: budi_abk1
              password: RahasiaPassword123!
              device_id: android-uuid-xxx-yyy
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Login gagal (username/password/device salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Cek sesi aktif user
      description: Cek sesi aktif & tarik hak akses (role & coop_assignments).
      responses:
        "200":
          description: Data user aktif & hak akses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                phone: "+628123456789"
                email: budi@andersonfarm.id
                device_id: android-uuid-xxx-yyy
                coop_assignments:
                  - coop_id: coop-uuid-1234
                    coop_name: Kandang A1
                  - coop_id: coop-uuid-5678
                    coop_name: Kandang B2
                is_active: true
                created_at: "2024-01-01T12:00:00Z"
                updated_at: "2024-01-10T12:00:00Z"
        "401":
          description: Tidak ada sesi aktif / token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Token tidak valid atau sesi sudah berakhir.
                errors: {}
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Menghapus (revoke) token dari server untuk mengakhiri sesi.
      security:
        - sanctum: []
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
        "401":
          description: Unauthenticated (Token tidak valid atau sudah kadaluarsa)
  /api/v1/auth/fcm-token:
    post:
      tags:
        - Auth
      summary: Simpan token FCM
      description: Simpan token Firebase untuk menerima Push Notification pada perangkat yang sedang digunakan.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FcmTokenRequest"
      responses:
        "200":
          description: Token berhasil disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
        "422":
          description: Validasi gagal (misal token kosong atau format salah)
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Permintaan reset password (OTP/Link)
      description: Endpoint publik untuk meminta OTP atau link reset password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            example:
              username: budi_abk1
              via: email
      responses:
        "200":
          description: Permintaan reset password berhasil, OTP/link dikirim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
              example:
                success: true
                message: OTP telah dikirim ke email Anda.
                data: {}
        "404":
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: User tidak ditemukan.
                errors: {}
        "422":
          description: Validasi gagal (input tidak valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Input tidak valid.
                errors:
                  username:
                    - Username wajib diisi.
  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Submit password baru (dengan OTP)
      description: Endpoint publik untuk submit password baru menggunakan OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              username: budi_abk1
              otp: "123456"
              new_password: PasswordBaru123!
      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
              example:
                success: true
                message: Password berhasil direset. Silakan login dengan password baru.
                data: {}
        "400":
          description: OTP salah atau sudah kadaluarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: OTP salah atau sudah kadaluarsa.
                errors: {}
        "422":
          description: Validasi gagal (input tidak valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Input tidak valid.
                errors:
                  new_password:
                    - Password minimal 8 karakter.
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Daftar pengguna (paginasi)
      description: Tarik daftar pekerja (paginasi).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian username/nama/email
      responses:
        "200":
          description: Daftar user dengan paginasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              example:
                success: true
                message: Daftar user berhasil diambil.
                data:
                  total: 2
                  per_page: 10
                  current_page: 1
                  last_page: 1
                  users:
                    - id: user-uuid-1234
                      username: budi_abk1
                      name: Budi Santoso
                      role: abk
                      email: budi@andersonfarm.id
                      phone: "+628123456789"
                      is_active: true
                      created_at: "2024-01-01T12:00:00Z"
                      updated_at: "2024-01-10T12:00:00Z"
                    - id: user-uuid-5678
                      username: sari_manager
                      name: Sari Dewi
                      role: manager
                      email: sari@andersonfarm.id
                      phone: "+628987654321"
                      is_active: true
                      created_at: "2024-01-02T12:00:00Z"
                      updated_at: "2024-01-11T12:00:00Z"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Token tidak valid.
                errors: {}
    post:
      tags:
        - Users
      summary: Buat pengguna baru
      description: |
        Buat pekerja baru. Endpoint ini hanya dapat diakses oleh user dengan role admin.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              username: budi_abk1
              password: RahasiaPassword123!
              name: Budi Santoso
              email: budi@andersonfarm.id
              phone: "+628123456789"
              role: abk
      responses:
        "201":
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                email: budi@andersonfarm.id
                phone: "+628123456789"
                is_active: true
                created_at: "2024-01-01T12:00:00Z"
                updated_at: "2024-01-10T12:00:00Z"
        "400":
          description: Username/email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Username/email sudah terdaftar.
                errors:
                  username:
                    - Username sudah digunakan.
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Input tidak valid.
                errors:
                  password:
                    - Password minimal 8 karakter.
  /api/v1/users/{id}:
    put:
      tags:
        - Users
      summary: Edit profil pekerja (full)
      description: |
        Edit seluruh data profil pekerja. Hanya dapat diakses oleh admin dan manager.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              username: budi_abk1
              password: RahasiaPassword123!
              name: Budi Santoso
              email: budi@andersonfarm.id
              phone: "+628123456789"
              role: abk
      responses:
        "200":
          description: Profil pekerja berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                email: budi@andersonfarm.id
                phone: "+628123456789"
                is_active: true
                created_at: "2024-01-01T12:00:00Z"
                updated_at: "2024-01-10T12:00:00Z"
        "400":
          description: Username/email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
        "403":
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
    patch:
      tags:
        - Users
      summary: Edit parsial profil pekerja
      description: |
        Edit sebagian data profil pekerja, misal reset/unbind device_id pekerja jika HP hilang. Hanya dapat diakses oleh admin dan manager.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nama lengkap user
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  description: Email user (opsional)
                  example: budi@andersonfarm.id
                phone:
                  type: string
                  description: Nomor HP user (opsional)
                  example: "+628123456789"
                device_id:
                  type: string
                  description: UUID perangkat (opsional, untuk reset/unbind)
                  example: null
            example:
              name: Budi Santoso
              device_id: null
      responses:
        "200":
          description: Profil pekerja berhasil diupdate (parsial)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                email: budi@andersonfarm.id
                phone: "+628123456789"
                is_active: true
                created_at: "2024-01-01T12:00:00Z"
                updated_at: "2024-01-10T12:00:00Z"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
        "403":
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
        "422":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
    delete:
      tags:
        - Users
      summary: Hapus akun pekerja (soft-delete)
      description: |
        Hapus akun pekerja (soft-delete). Hanya dapat diakses oleh admin.
      security:
        - sanctum: []
      responses:
        "200":
          description: Akun pekerja berhasil dihapus (soft-delete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
              example:
                success: true
                message: Akun pekerja berhasil dihapus.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
        "403":
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
  /api/v1/profile/change-password:
    post:
      tags:
        - Users
      summary: Ubah password mandiri
      description: Ubah password mandiri bagi user yang sedang login.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                  minLength: 8
                  description: Password lama user
                  example: RahasiaPassword123!
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: Password baru user
                  example: PasswordBaru456!
            example:
              old_password: RahasiaPassword123!
              new_password: PasswordBaru456!
      responses:
        "200":
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
              example:
                success: true
                message: Password berhasil diubah. Silakan login ulang jika diperlukan.
                data: {}
        "400":
          description: Password lama salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Password lama salah.
                errors:
                  old_password:
                    - Password lama tidak sesuai.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Token tidak valid.
                errors: {}
        "422":
          description: Validasi gagal (input tidak valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Input tidak valid.
                errors:
                  new_password:
                    - Password minimal 8 karakter.
  /api/v1/areas:
    post:
      tags:
        - Master
      summary: Tambah area
      description: Tambah wilayah operasional (Regional/Wilayah).
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
      responses:
        "201":
          description: Area berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/v1/areas/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      tags:
        - Master
      summary: Edit area
      description: Edit data wilayah operasional secara keseluruhan.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
      responses:
        "200":
          description: Area berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
        - Master
      summary: Hapus area
      description: Hapus area (soft-delete).
      security:
        - sanctum: []
      responses:
        "200":
          description: Area berhasil dihapus (soft-delete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/farms:
    post:
      tags:
        - Master
      summary: Tambah farm
      description: Tambah farm di bawah area.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmRequest"
            example:
              id: farm-uuid-1234
              area_id: area-uuid-5678
              name: Farm Bandung Selatan
              address: Jl. Raya Soreang No. 1, Bandung
              is_active: true
              created_at_client: "2024-01-01T12:00:00Z"
              updated_at_client: "2024-01-10T12:00:00Z"
      responses:
        "201":
          description: Farm berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmResponse"
              example:
                success: true
                data:
                  id: farm-uuid-1234
                  area_id: area-uuid-5678
                  name: Farm Bandung Selatan
                  address: Jl. Raya Soreang No. 1, Bandung
                  is_active: true
                  created_at_client: "2024-01-01T12:00:00Z"
                  updated_at_client: "2024-01-10T12:00:00Z"
                  server_id: 1
                  version: 1
                  sync_status: SYNCED
                  created_at_server: "2024-01-01T12:00:00Z"
                  updated_at_server: "2024-01-10T12:00:00Z"
                  deleted_at: null
        "400":
          description: Validasi gagal (input tidak valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Input tidak valid.
                errors:
                  name:
                    - Nama farm wajib diisi.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Token tidak valid.
                errors: {}
        "403":
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Anda tidak punya akses.
                errors: {}
  /api/v1/farms/{id}:
    patch:
      tags:
        - Master
      summary: Edit farm
      description: Edit farm di bawah area.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmRequest"
            example:
              id: farm-uuid-1234
              area_id: area-uuid-5678
              name: Farm Bandung Selatan
              address: Jl. Raya Soreang No. 1, Bandung
              is_active: true
              created_at_client: "2024-01-01T12:00:00Z"
              updated_at_client: "2024-01-10T12:00:00Z"
      responses:
        "200":
          description: Farm berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmResponse"
              example:
                success: true
                data:
                  id: farm-uuid-1234
                  area_id: area-uuid-5678
                  name: Farm Bandung Selatan
                  address: Jl. Raya Soreang No. 1, Bandung
                  is_active: true
                  created_at_client: "2024-01-01T12:00:00Z"
                  updated_at_client: "2024-01-10T12:00:00Z"
                  server_id: 1
                  version: 2
                  sync_status: SYNCED
                  created_at_server: "2024-01-01T12:00:00Z"
                  updated_at_server: "2024-01-10T12:00:00Z"
                  deleted_at: null
        "400":
          description: Validasi gagal (input tidak valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Input tidak valid.
                errors:
                  name:
                    - Nama farm wajib diisi.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Token tidak valid.
                errors: {}
        "403":
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Anda tidak punya akses.
                errors: {}
        "404":
          description: Farm tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Farm tidak ditemukan.
                errors: {}
    delete:
      tags:
        - Master
      summary: Hapus farm
      description: Hapus farm (soft-delete). Hanya dapat diakses oleh admin.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          description: ID farm yang akan dihapus
      responses:
        "200":
          description: Farm berhasil dihapus (soft-delete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralResponse"
              example:
                success: true
                message: Farm berhasil dihapus.
                data: {}
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Token tidak valid.
                errors: {}
        "403":
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Anda tidak punya akses.
                errors: {}
        "404":
          description: Farm tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                success: false
                message: Farm tidak ditemukan.
                errors: {}
  /api/v1/coops:
    post:
      tags:
        - Master
      summary: Tambah kandang
      description: Tambah bangunan fisik kandang.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopRequest"
            example:
              id: coop-uuid-1234
              farm_id: farm-uuid-5678
