    post:
      tags:
        - Sync
      summary: Kirim persetujuan digital periode
      description: Mengirim jejak persetujuan digital ContractAcceptance dari ABK.
  /api/v1/sync/daily-activities:
    get:
      tags:
        - Sync
      summary: Sync data aktivitas harian
      description: Sinkronisasi satu header beserta relasi anaknya (HBE, Foto, Panen, ovk_usages, Checklist).
    post:
      tags:
        - Sync
      summary: Kirim aktivitas harian
      description: Push aktivitas harian beserta relasi anaknya.
  /api/v1/sync/finances:
    get:
      tags:
        - Sync
      summary: Sync data keuangan
      description: Sinkronisasi arus kas dan status pembayaran gaji.
    post:
      tags:
        - Sync
      summary: Kirim data keuangan
      description: Push transaksi pembelian, operasional, dan pembayaran gaji.
  /api/v1/sync/maintenances:
    get:
      tags:
        - Sync
      summary: Sync data maintenance
      description: Sinkronisasi perbaikan fisik bangunan kandang (MaintenanceLog).
    post:
      tags:
        - Sync
      summary: Kirim data maintenance
      description: Push data perbaikan fisik bangunan kandang.
  /api/v1/sync/rhpps:
    get:
      tags:
        - Sync
      summary: Sync data RHPP
      description: Unduh rekap laba bersih akhir dan dokumen PDF-nya untuk dilihat ABK/PIC.
  /api/v1/sync/education:
    get:
      tags:
        - Sync
      summary: Sync data edukasi offline
      description: Unduh artikel edukasi & referensi harga secara offline.
  /api/v1/sync/activity-logs:
    post:
      tags:
        - Sync
      summary: Kirim audit trail aktivitas user
      description: Push rekam jejak (audit trail) tombol aplikasi yang diklik user.
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
      example: 1
    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    CursorParam:
      name: cursor
      in: query
      description: Cursor untuk pagination berbasis cursor. Jika tidak diisi, akan mulai dari awal.
      required: false
      schema:
        type: string
      example: cursor-uuid-1234
    LimitParam:
      name: limit
      in: query
      description: Jumlah data per page (pagination berbasis cursor)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID dari resource yang dituju.
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      properties:
        username:
          type: string
          minLength: 4
        password:
          type: string
          format: password
          minLength: 8
        device_id:
          type: string
          description: UUID unik perangkat yang digunakan login
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT token untuk autentikasi selanjutnya
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        data:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: ID unik user (UUID atau numeric)
          example: user-uuid-1234
        username:
          type: string
          example: budi_abk1
        name:
          type: string
          description: Nama lengkap user
          example: Budi Santoso
        role:
          $ref: "#/components/schemas/UserRole"
        phone:
          type: string
          description: Nomor HP user
          example: "+628123456789"
        email:
          type: string
          format: email
          example: budi@andersonfarm.id
        device_id:
          type: string
          description: UUID perangkat yang terdaftar (jika sudah binding)
          example: android-uuid-xxx-yyy
        coop_assignments:
          type: array
          description: Daftar kandang yang diassign ke user (jika ada)
          items:
            type: object
            properties:
              coop_id:
                type: string
                description: ID kandang
                example: coop-uuid-1234
              coop_name:
                type: string
                description: Nama kandang
                example: Kandang A1
        is_active:
          type: boolean
          description: Status aktif user
          example: true
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-10T12:00:00Z"
    FcmTokenRequest:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string
          description: Token unik yang dihasilkan oleh Firebase Cloud Messaging di perangkat.
          example: fcm_token_xyz_123...
        device_name:
          type: string
          description: Nama opsional perangkat untuk identifikasi log.
          example: Samsung S24 - Android 14
    ForgotPasswordRequest:
      type: object
      required:
        - username
        - via
      properties:
        username:
          type: string
          description: Username user yang ingin reset password
          example: budi_abk1
        via:
          type: string
          description: Media pengiriman OTP/link (email/wa)
          enum:
            - email
            - wa
          example: email
    ResetPasswordRequest:
      type: object
      required:
        - username
        - otp
        - new_password
      properties:
        username:
          type: string
          description: Username user
          example: budi_abk1
        otp:
          type: string
          description: Kode OTP yang diterima user
          example: "123456"
        new_password:
          type: string
          format: password
          minLength: 8
          description: Password baru user
          example: PasswordBaru123!
    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - name
        - role
      properties:
        username:
          type: string
          minLength: 4
          description: Username unik user
          example: budi_abk1
        password:
          type: string
          format: password
          minLength: 8
          description: Password user (akan di-hash)
          example: RahasiaPassword123!
        name:
          type: string
          description: Nama lengkap user
          example: Budi Santoso
        email:
          type: string
          format: email
          description: Email user (opsional)
          example: budi@andersonfarm.id
        phone:
          type: string
          description: Nomor HP user (opsional)
          example: "+628123456789"
        role:
          $ref: "#/components/schemas/UserRole"
    FarmBase:
      type: object
      required:
        - area_id
        - name
        - address
      properties:
        area_id:
          type: string
          format: uuid
          description: ID Area induk farm ini.
        name:
          type: string
          example: Farm Bandung Selatan
        address:
          type: string
          example: Jl. Raya Soreang No. 1, Bandung
        is_active:
          type: boolean
          default: true
          example: true
    FarmRequest:
      allOf:
        - $ref: "#/components/schemas/OfflineMetadataRequest"
        - $ref: "#/components/schemas/FarmBase"
    FarmResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/FarmRequest"
            - $ref: "#/components/schemas/OfflineMetadataResponse"
    UserListData:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: user-uuid-1234
              username:
                type: string
                example: budi_abk1
              name:
                type: string
                example: Budi Santoso
              role:
                $ref: "#/components/schemas/UserRole"
              email:
                type: string
                format: email
                example: budi@andersonfarm.id
              phone:
                type: string
                example: "+628123456789"
              is_active:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: "2024-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-10T12:00:00Z"
    UserListResponse:
      type: object
      description: Response daftar user dengan dukungan pagination page/limit atau cursor.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Daftar user berhasil diambil.
        data:
          allOf:
            - $ref: "#/components/schemas/UserListData"
            - oneOf:
                - $ref: "#/components/schemas/PaginationMetaPage"
                - $ref: "#/components/schemas/PaginationMetaCursor"
    AreaBase:
      type: object
      required:
        - name
        - manager_id
      properties:
        name:
          type: string
          example: Area Jawa Barat
        manager_id:
          type: string
          format: uuid
          description: ID User dengan role Manager.
    AreaRequest:
      allOf:
        - $ref: "#/components/schemas/OfflineMetadataRequest"
        - $ref: "#/components/schemas/AreaBase"
    AreaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/AreaRequest"
            - $ref: "#/components/schemas/OfflineMetadataResponse"
    CoopBase:
      type: object
      required:
        - farm_id
        - name
        - capacity
        - floor
        - coop_type
      properties:
        farm_id:
          type: string
          format: uuid
          description: ID Farm induk kandang ini.
        name:
          type: string
          example: Kandang A1
        capacity:
          type: integer
          example: 10000
        floor:
          type: integer
          example: 1
        coop_type:
          $ref: "#/components/schemas/CoopType"
        note:
          oneOf:
            - type: string
            - type: "null"
          example: Kandang utama untuk starter
        is_active:
          type: boolean
          default: true
          example: true
    CoopRequest:
      allOf:
        - $ref: "#/components/schemas/OfflineMetadataRequest"
        - $ref: "#/components/schemas/CoopBase"
    CoopResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/CoopRequest"
            - $ref: "#/components/schemas/OfflineMetadataResponse"
    EquipmentTypeBase:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Temptron
        description:
          oneOf:
            - type: string
            - type: "null"
          example: Sensor suhu digital
    EquipmentTypeRequest:
      allOf:
        - $ref: "#/components/schemas/OfflineMetadataRequest"
        - $ref: "#/components/schemas/EquipmentTypeBase"
    EquipmentTypeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/EquipmentTypeRequest"
            - $ref: "#/components/schemas/OfflineMetadataResponse"
    UserRole:
      type: string
      enum:
        - admin
        - finance
        - manager
        - pic
        - abk
        - investor
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            username:
              - The username has already been taken.
    GeneralResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
          description: Field tambahan jika diperlukan di masa depan. Bisa berupa objek atau null.
    PaginationMetaPage:
      type: object
      description: Metadata untuk pagination berbasis page/limit
      properties:
        total:
          type: integer
          example: 2
        per_page:
          type: integer
