# ==========================================
# EDUCATION ARTICLES
# ==========================================
EducationArticleBase:
  type: object
  required: [name]
  properties:
    name:
      type: string
      example: "Panduan Vaksinasi Ayam Broiler"
      description: Judul artikel edukasi
    excerpt:
      type: string
      example: "Vaksinasi yang tepat dapat menurunkan angka mortalitas hingga..."
      description: Ringkasan singkat artikel
      nullable: true
    link_url:
      type: string
      example: "https://andersonfarm.id/artikel/panduan-vaksinasi"
      description: Link URL eksternal artikel (jika ada)
      nullable: true
    image_url:
      type: string
      example: "https://andersonfarm.id/images/vaksin.jpg"
      description: URL gambar thumbnail artikel
      nullable: true
    image_path_local:
      type: string
      example: "storage/articles/vaksin.jpg"
      description: Path gambar di server lokal
      nullable: true

EducationArticleRequest:
  allOf:
    - $ref: "./general.yaml#/OfflineMetadataRequest"
    - $ref: "#/EducationArticleBase"

EducationArticleResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: "#/EducationArticleRequest"
        - $ref: "./general.yaml#/OfflineMetadataResponse"

# ==========================================
# PRICE REFERENCES
# ==========================================
PriceReferenceBase:
  type: object
  required: [name]
  properties:
    name:
      type: string
      example: "Harga Ayam Broiler Hidup"
      description: Nama komoditas referensi harga
    highlight_price:
      type: number
      format: float
      example: 18500
      description: Harga acuan/highlight saat ini
      nullable: true
    link_url:
      type: string
      example: "https://hargapangan.id/ayam"
      description: Link ke sumber harga (jika ada)
      nullable: true
    image_url:
      type: string
      example: "https://andersonfarm.id/images/harga-ayam.jpg"
      description: URL gambar representasi komoditas
      nullable: true
    image_path_local:
      type: string
      example: "storage/references/harga-ayam.jpg"
      description: Path gambar di server lokal
      nullable: true

PriceReferenceRequest:
  allOf:
    - $ref: "./general.yaml#/OfflineMetadataRequest"
    - $ref: "#/PriceReferenceBase"

PriceReferenceResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: "#/PriceReferenceRequest"
        - $ref: "./general.yaml#/OfflineMetadataResponse"
