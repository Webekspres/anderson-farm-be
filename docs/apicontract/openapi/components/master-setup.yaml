  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: "#/FormConfigRequest"
        - $ref: "../components/general.yaml#/OfflineMetadataResponse"

EquipmentTypeResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
