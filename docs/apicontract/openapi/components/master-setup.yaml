# --- BASE SCHEMAS (Business Fields Only) ---
ReportTemplateBase:
  type: object
  required: [name, report_type, content_placeholder]
  properties:
    name:
      type: string
      example: "Laporan Panen Mingguan"
      description: Nama template laporan
    report_type:
      type: string
      example: "WHATSAPP"
      description: "Jenis laporan atau media (misal: WHATSAPP, EMAIL, dsb)"
    content_placeholder:
      type: string
      example: "Halo {{nama_farm}}, hasil panen minggu ini ..."
      description: Teks template dengan variabel placeholder

# --- REQUEST SCHEMAS (Dikirim oleh App/Client) ---
ReportTemplateRequest:
  allOf:
    - $ref: "../components/general.yaml#/OfflineMetadataRequest"
    - $ref: "#/ReportTemplateBase"

# --- RESPONSE SCHEMAS (Dibalas oleh Server) ---
ReportTemplateResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: "#/ReportTemplateRequest"
        - $ref: "../components/general.yaml#/OfflineMetadataResponse"
# --- BASE SCHEMAS (Business Fields Only) ---
OvkItemBase:
  type: object
  required: [name, type, unit]
  properties:
    name:
      type: string
      example: "Vita Stress"
      description: Nama obat, vaksin, atau bahan kimia
    type:
      type: string
      enum: [OBAT, VAKSIN, KIMIA]
      example: "OBAT"
      description: Jenis item (OBAT/VAKSIN/KIMIA)
    unit:
      type: string
      example: "gram"
      description: Satuan pengukuran (gram, botol, sachet, dll)
    description:
      type: ["string", "null"]
      example: "Vitamin untuk mengurangi stres ayam."
      description: Keterangan tambahan
    is_active:
      type: boolean
      default: true
      example: true

# --- REQUEST SCHEMAS (Dikirim oleh App/Client) ---
OvkItemRequest:
  allOf:
    - $ref: "../components/general.yaml#/OfflineMetadataRequest"
    - $ref: "#/OvkItemBase"

# --- RESPONSE SCHEMAS (Dibalas oleh Server) ---
OvkItemResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: "#/OvkItemRequest"
        - $ref: "../components/general.yaml#/OfflineMetadataResponse"
# --- BASE SCHEMAS (Business Fields Only) ---
TransactionCategoryBase:
  type: object
  required: [name, type]
  properties:
    name:
      type: string
      example: "Pemasukan Panen"
      description: Nama kategori transaksi
    type:
      type: string
      enum: [INCOME, EXPENSE]
      example: "INCOME"
      description: Jenis transaksi (INCOME/EXPENSE)
    is_active:
      type: boolean
      default: true
      example: true

# --- REQUEST SCHEMAS (Dikirim oleh App/Client) ---
TransactionCategoryRequest:
