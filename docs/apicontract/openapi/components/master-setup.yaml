    name:
      type: string
      example: "Kipas Exhaust 50 inch"
    description:
      type: ["string", "null"]
      example: "Kipas angin utama untuk tipe kandang closed house."

# --- REQUEST SCHEMAS (Dikirim oleh App/Client) ---
FormConfigRequest:
  allOf:
    - $ref: "../components/general.yaml#/OfflineMetadataRequest"
    - $ref: "#/FormConfigBase"

EquipmentTypeRequest:
