    - $ref: "#/TransactionCategoryBase"

# --- RESPONSE SCHEMAS (Dibalas oleh Server) ---
TransactionCategoryResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: "#/TransactionCategoryRequest"
        - $ref: "../components/general.yaml#/OfflineMetadataResponse"
# --- BASE SCHEMAS (Business Fields Only) ---
FormConfigBase:
  type: object
  required: [category, key_name, config_value]
  properties:
    category:
      $ref: "../components/enums.yaml#/FormCategoryEnum"
    key_name:
      type: string
      example: "temp_sensor_1"
      description: Kunci unik/slug untuk field ini di database.
    config_value:
      type: string
      example: '{"type": "number", "unit": "Celcius", "required": true}'
      description: Konfigurasi struktur UI dalam format JSON string.

EquipmentTypeBase:
  type: object
