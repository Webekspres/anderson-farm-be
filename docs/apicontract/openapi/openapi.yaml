openapi: 3.1.0
info:
  version: 1.0.0
  title: Anderson Farm API
  description: API sistem manajemen pertanian offline-first untuk Anderson Farm

paths:
  # === AUTENTIKASI & KEAMANAN ===
  /api/v1/auth/login:
    $ref: "./paths/auth.yaml#/login"

  /api/v1/auth/me:
    $ref: "./paths/auth.yaml#/me"

  /api/v1/auth/logout:
    $ref: "./paths/auth.yaml#/logout"

  /api/v1/auth/fcm-token:
    $ref: "./paths/auth.yaml#/fcm-token"

  /api/v1/auth/forgot-password:
    $ref: "./paths/auth.yaml#/forgot-password"

  /api/v1/auth/reset-password:
    $ref: "./paths/auth.yaml#/reset-password"

  # === MANAJEMEN PENGGUNA & PROFIL ===
  /api/v1/users:
    $ref: "./paths/user.yaml#/users"

  /api/v1/users/{id}:
    $ref: "./paths/user.yaml#/userSingle"

  /api/v1/profile/change-password:
    $ref: "./paths/user.yaml#/change-password"

  # === MASTER DATA: AREA (COLLECTION) ===
  /api/v1/areas:
    $ref: "./paths/place.yaml#/areas"

  # === MASTER DATA: AREA (SINGLE RESOURCE) ===
  /api/v1/areas/{id}:
    $ref: "./paths/place.yaml#/areaSingle"

  /api/v1/farms:
    $ref: "./paths/place.yaml#/farms"

  /api/v1/farms/{id}:
    $ref: "./paths/place.yaml#/farmSingle"

  /api/v1/coops:
    $ref: "./paths/place.yaml#/coops"

  /api/v1/coops/{id}:
    $ref: "./paths/place.yaml#/coopSingle"

  /api/v1/form-configs:
    $ref: "./paths/master-setup.yaml#/form-configs"

  /api/v1/form-configs/{id}:
    $ref: "./paths/master-setup.yaml#/single-form-configs"

  # =========================================================================
  # 2. MASTER DATA: EQUIPMENT TYPES (Jenis/Merk Alat)
  # =========================================================================
  /api/v1/equipment-types:
    $ref: "./paths/master-setup.yaml#/equipment-types"

  /api/v1/equipment-types/{id}:
    $ref: "./paths/master-setup.yaml#/single-equipment-types"

  /api/v1/transaction-categories:
    $ref: "./paths/master-setup.yaml#/transaction-categories"

  /api/v1/transaction-categories/{id}:
    $ref: "./paths/master-setup.yaml#/single-transaction-categories"

  /api/v1/ovk-items:
    $ref: "./paths/master-setup.yaml#/ovk-items"

  /api/v1/ovk-items/{id}:
    $ref: "./paths/master-setup.yaml#/single-ovk-items"

  /api/v1/education-articles:
    $ref: "./paths/education.yaml#/education-articles"

  /api/v1/education-articles/{id}:
    $ref: "./paths/education.yaml#/single-education-articles"

  /api/v1/price-references:
    $ref: "./paths/education.yaml#/price-references"

  /api/v1/price-references/{id}:
    $ref: "./paths/education.yaml#/single-price-references"

  /api/v1/report-templates:
    $ref: "./paths/master-setup.yaml#/report-templates"

  /api/v1/report-templates/{id}:
    $ref: "./paths/master-setup.yaml#/single-report-templates"

  # === SETUP KANDANG & PERIODE TERNAK ===
  /api/v1/coops/{id}/documents:
    $ref: "./paths/documents.yaml#/coop-documents"

  /api/v1/coops/{id}/form-assignments:
    $ref: "./paths/setup.yaml#/coop-form-assignments"

  /api/v1/coops/{id}/equipments:
    $ref: "./paths/setup.yaml#/coop-equipments"

  /api/v1/periods:
    $ref: "./paths/period.yaml#/periods"

  /api/v1/periods/{id}/investors:
    $ref: "./paths/period.yaml#/periods-investors"

  /api/v1/periods/{id}/checklist-tasks:
    $ref: "./paths/period.yaml#/periods-checklist-tasks"

  /api/v1/periods/{id}/form-assignments:
    $ref: "./paths/period.yaml#/periods-form-assignments"

  /api/v1/periods/{id}/contracts:
    $ref: "./paths/period.yaml#/periods-contracts"

  /api/v1/periods/{id}/documents:
    $ref: "./paths/period.yaml#/periods-documents"

  /api/v1/periods/{id}/rhpp-documents:
    $ref: "./paths/period.yaml#/periods-rhpp-documents"

  # === EKSPOR, IMPOR & UPLOAD FILE ===
  /api/v1/uploads:
    post:
      tags: [Files]
      summary: Upload file fisik
      description: Unggah file fisik (PDF/JPG) secara multipart.
    delete:
      tags: [Files]
      summary: Hapus file fisik
      description: Menghapus file orphaned jika user batal simpan.

  /api/v1/export/rhpp:
    get:
      tags: [Files]
      summary: Export Excel/PDF RHPP
      description: Generate Excel/PDF perhitungan detail periode sebelum difinalisasi.

  /api/v1/export/harvests:
    get:
      tags: [Files]
      summary: Export Excel rekap panen
      description: Generate Excel rekap panen bertahap (HarvestEntry).

  /api/v1/export/evaluations:
    get:
      tags: [Files]
      summary: Export Excel evaluasi teknis
      description: Generate Excel evaluasi teknis harian.

  /api/v1/export/template-salary:
    get:
      tags: [Files]
      summary: Download template import gaji
      description: Download format Excel kosong untuk persiapan import gaji.

  /api/v1/import/salary:
    post:
      tags: [Files]
      summary: Import data gaji ABK
      description: Unggah data tagihan upah ABK massal via Excel.

  # === LOGIKA BISNIS & PORTAL EKSTERNAL ===
  /api/v1/periods/{id}/close:
    post:
      tags: [Bisnis]
      summary: Tutup periode ternak
      description: Tutup Periode, validasi backend otomatis sebelum siklus dikunci.

  /api/v1/rhpps/{period_id}/publish:
    post:
      tags: [Bisnis]
      summary: Publish RHPP
      description: Ketok Palu RHPP, publish_status jadi PUBLISHED dan mengunci laporan.

  /api/v1/investor/dashboard:
    get:
      tags: [Bisnis]
      summary: Portal dashboard investor
      description: Rekap ROI super ringan tanpa SQLite.

  # === SISTEM & NOTIFIKASI ===
  /api/v1/system/check-version:
    get:
      tags: [System]
      summary: Cek versi aplikasi
      description: Splash screen, paksa update jika outdated.

  /api/v1/notifications:
    get:
      tags: [System]
      summary: Daftar notifikasi user
      description: Tarik riwayat pesan masuk (Inbox aplikasi).

  /api/v1/notifications/{id}/read:
    patch:
      tags: [System]
      summary: Tandai notifikasi dibaca
      description:
        Tandai notifikasi telah dibaca.

        # === SYNC (OFFLINE-FIRST AGGREGATE) ===
  /api/v1/sync/master-data:
    get:
      tags: [Sync]
      summary: Sync master data offline
      description: Mengunduh cache referensi dasar (termasuk ovk_items dan coop_documents).

  /api/v1/sync/periods:
    get:
      tags: [Sync]
      summary: Sync data periode ternak
      description: Menarik detail periode aktif.
    post:
      tags: [Sync]
      summary: Kirim persetujuan digital periode
      description: Mengirim jejak persetujuan digital ContractAcceptance dari ABK.

  /api/v1/sync/daily-activities:
    get:
      tags: [Sync]
      summary: Sync data aktivitas harian
      description: Sinkronisasi satu header beserta relasi anaknya (HBE, Foto, Panen, ovk_usages, Checklist).
    post:
      tags: [Sync]
      summary: Kirim aktivitas harian
      description: Push aktivitas harian beserta relasi anaknya.

  /api/v1/sync/finances:
    get:
      tags: [Sync]
      summary: Sync data keuangan
      description: Sinkronisasi arus kas dan status pembayaran gaji.
    post:
      tags: [Sync]
      summary: Kirim data keuangan
      description: Push transaksi pembelian, operasional, dan pembayaran gaji.

  /api/v1/sync/maintenances:
    get:
      tags: [Sync]
      summary: Sync data maintenance
      description: Sinkronisasi perbaikan fisik bangunan kandang (MaintenanceLog).
    post:
      tags: [Sync]
      summary: Kirim data maintenance
      description: Push data perbaikan fisik bangunan kandang.

  /api/v1/sync/rhpps:
    get:
      tags: [Sync]
      summary: Sync data RHPP
      description: Unduh rekap laba bersih akhir dan dokumen PDF-nya untuk dilihat ABK/PIC.

  /api/v1/sync/education:
    get:
      tags: [Sync]
      summary: Sync data edukasi offline
      description: Unduh artikel edukasi & referensi harga secara offline.

  /api/v1/sync/activity-logs:
    post:
      tags: [Sync]
      summary: Kirim audit trail aktivitas user
      description: Push rekam jejak (audit trail) tombol aplikasi yang diklik user.

components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
      example: 1
    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    CursorParam:
      name: cursor
      in: query
      description: Cursor untuk pagination berbasis cursor. Jika tidak diisi, akan mulai dari awal.
      required: false
      schema:
        type: string
      example: "cursor-uuid-1234"
    LimitParam:
      name: limit
      in: query
      description: Jumlah data per page (pagination berbasis cursor)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID dari resource yang dituju.

  schemas:
    # =====================
    # LOGIN REQUEST/RESPONSE
    # =====================
    LoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      properties:
        username:
          type: string
          minLength: 4
        password:
          type: string
          format: password
          minLength: 8
        device_id:
          type: string
          description: UUID unik perangkat yang digunakan login

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT token untuk autentikasi selanjutnya
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        data:
          $ref: "#/components/schemas/UserResponse"

    # =====================
    # USER RESPONSE
    # =====================
    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: ID unik user (UUID atau numeric)
          example: "user-uuid-1234"
        username:
          type: string
          example: "budi_abk1"
        name:
          type: string
          description: Nama lengkap user
          example: "Budi Santoso"
        role:
          $ref: "./components/enums.yaml#/UserRole"
        phone:
          type: string
          description: Nomor HP user
          example: "+628123456789"
        email:
          type: string
          format: email
          example: "budi@andersonfarm.id"
        device_id:
          type: string
          description: UUID perangkat yang terdaftar (jika sudah binding)
          example: "android-uuid-xxx-yyy"
        coop_assignments:
          type: array
          description: Daftar kandang yang diassign ke user (jika ada)
          items:
            type: object
            properties:
              coop_id:
                type: string
                description: ID kandang
                example: "coop-uuid-1234"
              coop_name:
                type: string
                description: Nama kandang
                example: "Kandang A1"
        is_active:
          type: boolean
          description: Status aktif user
          example: true
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-10T12:00:00Z"

    # --- REQUEST SCHEMAS ---
    FcmTokenRequest:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string
          description: Token unik yang dihasilkan oleh Firebase Cloud Messaging di perangkat.
          example: "fcm_token_xyz_123..."
        device_name:
          type: string
          description: Nama opsional perangkat untuk identifikasi log.
          example: "Samsung S24 - Android 14"

    # --- REQUEST SCHEMAS ---
    ForgotPasswordRequest:
      type: object
      required:
        - username
        - via
      properties:
        username:
          type: string
          description: Username user yang ingin reset password
          example: "budi_abk1"
        via:
          type: string
          description: Media pengiriman OTP/link (email/wa)
          enum: [email, wa]
          example: "email"

    ResetPasswordRequest:
      type: object
      required:
        - username
        - otp
        - new_password
      properties:
        username:
          type: string
          description: Username user
          example: "budi_abk1"
        otp:
          type: string
          description: Kode OTP yang diterima user
          example: "123456"
        new_password:
          type: string
          format: password
          minLength: 8
          description: Password baru user
          example: "PasswordBaru123!"

    # --- REQUEST SCHEMAS ---
    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - name
        - role
      properties:
        username:
          type: string
          minLength: 4
          description: Username unik user
          example: "budi_abk1"
        password:
          type: string
          format: password
          minLength: 8
          description: Password user (akan di-hash)
          example: "RahasiaPassword123!"
        name:
          type: string
          description: Nama lengkap user
          example: "Budi Santoso"
        email:
          type: string
          format: email
          description: Email user (opsional)
          example: "budi@andersonfarm.id"
        phone:
          type: string
          description: Nomor HP user (opsional)
          example: "+628123456789"
        role:
          $ref: "./components/enums.yaml#/UserRole"

    # --- FARM SPECIFIC ---
    FarmBase:
      type: object
      required: [area_id, name, address]
      properties:
        area_id:
          type: string
          format: uuid
          description: ID Area induk farm ini.
        name:
          type: string
          example: "Farm Bandung Selatan"
        address:
          type: string
          example: "Jl. Raya Soreang No. 1, Bandung"
        is_active:
          type: boolean
          default: true
          example: true

    # Skema untuk Request (Metadata Client + Data Farm)
    FarmRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/FarmBase"

    # Skema untuk Response (Metadata Server + Data Farm + Metadata Client)
    FarmResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/FarmRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

    UserListData:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "user-uuid-1234"
              username:
                type: string
                example: "budi_abk1"
              name:
                type: string
                example: "Budi Santoso"
              role:
                $ref: "./components/enums.yaml#/UserRole"
              email:
                type: string
                format: email
                example: "budi@andersonfarm.id"
              phone:
                type: string
                example: "+628123456789"
              is_active:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: "2024-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-10T12:00:00Z"

    UserListResponse:
      type: object
      description: Response daftar user dengan dukungan pagination page/limit atau cursor.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Daftar user berhasil diambil."
        data:
          allOf:
            - $ref: "#/components/schemas/UserListData"
            - oneOf:
                - $ref: "./components/response.yaml#/PaginationMetaPage"
                - $ref: "./components/response.yaml#/PaginationMetaCursor"

    # --- AREA SPECIFIC ---
    AreaBase:
      type: object
      required: [name, manager_id]
      properties:
        name:
          type: string
          example: "Area Jawa Barat"
        manager_id:
          type: string
          format: uuid
          description: ID User dengan role Manager.

    # Skema untuk Request (Metadata Client + Data Area)
    AreaRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/AreaBase"

    # Skema untuk Response (Metadata Server + Data Area + Metadata Client)
    AreaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/AreaRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

    # --- COOP SPECIFIC ---
    CoopBase:
      type: object
      required: [farm_id, name, capacity, floor, coop_type]
      properties:
        farm_id:
          type: string
          format: uuid
          description: ID Farm induk kandang ini.
        name:
          type: string
          example: "Kandang A1"
        capacity:
          type: integer
          example: 10000
        floor:
          type: integer
          example: 1
        coop_type:
          $ref: "./components/enums.yaml#/CoopType"
        note:
          oneOf:
            - type: string
            - type: "null"
          example: "Kandang utama untuk starter"
        is_active:
          type: boolean
          default: true
          example: true

    CoopRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/CoopBase"

    CoopResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/CoopRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

    # --- EQUIPMENT TYPE SPECIFIC ---
    EquipmentTypeBase:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Temptron"
        description:
          oneOf:
            - type: string
            - type: "null"
          example: "Sensor suhu digital"

    EquipmentTypeRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/EquipmentTypeBase"

    EquipmentTypeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/EquipmentTypeRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - ApiKey: []
