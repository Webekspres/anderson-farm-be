  /api/v1/farms:
    $ref: "./paths/master-data.yaml#/farms"

  /api/v1/farms/{id}:
    $ref: "./paths/master-data.yaml#/farmSingle"

  /api/v1/coops:
    $ref: "./paths/master-data.yaml#/coops"

  /api/v1/coops/{id}:
    $ref: "./paths/master-data.yaml#/coopSingle"

  /api/v1/coop-floors:
    $ref: "./paths/coop-floors.yaml#/coop-floors"

  /api/v1/coop-floors/{id}:
    $ref: "./paths/coop-floors.yaml#/coopFloorSingle"

  /api/v1/form-configs:
    $ref: "./paths/master-setup.yaml#/form-configs"

  /api/v1/form-configs/{id}:
    $ref: "./paths/master-setup.yaml#/single-form-configs"

  # =========================================================================
  # 2. MASTER DATA: EQUIPMENT TYPES (Jenis/Merk Alat)
  # =========================================================================
  /api/v1/equipment-types:
    $ref: "./paths/master-setup.yaml#/equipment-types"

  /api/v1/equipment-types/{id}:
    $ref: "./paths/master-setup.yaml#/single-equipment-types"

  /api/v1/equipment-types/{id}/form-configs:
    $ref: "./paths/master-setup.yaml#/equipment-type-form-configs"

  /api/v1/transaction-categories:
    $ref: "./paths/master-setup.yaml#/transaction-categories"

  /api/v1/transaction-categories/{id}:
    $ref: "./paths/master-setup.yaml#/single-transaction-categories"

  /api/v1/ovk-items:
    $ref: "./paths/master-setup.yaml#/ovk-items"

  /api/v1/ovk-items/{id}:
    $ref: "./paths/master-setup.yaml#/single-ovk-items"

  /api/v1/education-articles:
    $ref: "./paths/education.yaml#/education-articles"

  /api/v1/education-articles/{id}:
    $ref: "./paths/education.yaml#/single-education-articles"

  /api/v1/price-references:
    $ref: "./paths/education.yaml#/price-references"

  /api/v1/price-references/{id}:
    $ref: "./paths/education.yaml#/single-price-references"

  /api/v1/report-templates:
    $ref: "./paths/master-setup.yaml#/report-templates"

  /api/v1/report-templates/{id}:
    $ref: "./paths/master-setup.yaml#/single-report-templates"

  # === SETUP KANDANG & PERIODE TERNAK ===
  /api/v1/coops/{id}/documents:
    $ref: "./paths/documents.yaml#/coop-documents"

  /api/v1/coops/{id}/documents/{document_id}:
    $ref: "./paths/documents.yaml#/coop-document-single"

  /api/v1/coops/{id}/user-assignments:
    $ref: "./paths/setup.yaml#/coop-user-assignments"

  /api/v1/coops/{id}/form-assignments:
    $ref: "./paths/setup.yaml#/coop-form-assignments"

  /api/v1/coops/{id}/equipments:
    $ref: "./paths/setup.yaml#/coop-equipments"

  /api/v1/coops/{id}/equipments/{equipment_id}:
    $ref: "./paths/setup.yaml#/coop-equipment-single"

  /api/v1/periods:
    $ref: "./paths/period-full.yaml#/periods"

  /api/v1/periods/{id}:
    $ref: "./paths/period-full.yaml#/periodSingle"

  /api/v1/periods/{id}/investors:
    $ref: "./paths/period-full.yaml#/period-investors"

  /api/v1/periods/{id}/checklist-tasks:
    $ref: "./paths/period-full.yaml#/period-checklist-tasks"

  /api/v1/periods/{id}/form-assignments:
    $ref: "./paths/period-full.yaml#/period-form-assignments"

  /api/v1/periods/{id}/contracts:
    $ref: "./paths/period-full.yaml#/period-contracts"

  /api/v1/contracts/{id}:
    $ref: "./paths/period-full.yaml#/contracts-single"

  /api/v1/periods/{id}/documents:
    $ref: "./paths/period-full.yaml#/period-documents"

  /api/v1/periods/{id}/rhpp-documents:
    $ref: "./paths/period-full.yaml#/period-rhpp-documents"

  # === EKSPOR, IMPOR & UPLOAD FILE ===
  /api/v1/uploads:
