  /api/v1/export/ovk-usages:
    $ref: "./paths/export.yaml#/ovk-usages"

  /api/v1/export/bop-details:
    $ref: "./paths/export.yaml#/bop-details"

  /api/v1/export/harvests:
    $ref: "./paths/export.yaml#/harvests"

  /api/v1/export/evaluations:
    $ref: "./paths/export.yaml#/evaluations"

  /api/v1/export/template-salary:
    $ref: "./paths/export.yaml#/template-salary"

  /api/v1/import/salary:
    $ref: "./paths/upload.yaml#/import-salary"

  # === LOGIKA BISNIS & PORTAL EKSTERNAL ===
  /api/v1/periods/{id}/close:
    $ref: "./paths/period-full.yaml#/close-period"

  /api/v1/rhpps/{period_id}/publish:
    $ref: "./paths/period-full.yaml#/rhpps-publish"

  # === APPROVAL ===
  /api/v1/approvals/daily-activities:
    $ref: "./paths/approvals.yaml#/daily-activities"

  /api/v1/approvals/daily-activities/{id}:
    $ref: "./paths/approvals.yaml#/daily-activity-single"

  # === SISTEM & NOTIFIKASI ===
  /api/v1/system/check-version:
    $ref: "./paths/system.yaml#/check-version"

  # Notifikasi & Pesan Masuk
  /api/v1/notifications:
    $ref: "./paths/system.yaml#/notifications"

  /api/v1/notifications/read-all:
    $ref: "./paths/system.yaml#/notifications-read-all"

  /api/v1/notifications/{id}/read:
    $ref: "./paths/system.yaml#/notification-read"

  # =========================================================================
  # SYNC: OFFLINE-FIRST SYNCHRONIZATION
  # =========================================================================
  /api/v1/sync/master-data:
    $ref: "./paths/sync-full.yaml#/sync-master-data"

  /api/v1/sync/periods:
    $ref: "./paths/sync-full.yaml#/sync-periods"

  /api/v1/sync/daily-activities:
    $ref: "./paths/sync-full.yaml#/sync-daily-activities"

  /api/v1/sync/finances:
    $ref: "./paths/sync-full.yaml#/sync-finances"

  /api/v1/sync/maintenances:
    $ref: "./paths/sync-full.yaml#/sync-maintenances"

  /api/v1/sync/rhpps:
    $ref: "./paths/sync-full.yaml#/sync-rhpps"

  /api/v1/sync/education:
    $ref: "./paths/sync-full.yaml#/sync-education"

  /api/v1/sync/activity-logs:
    $ref: "./paths/sync-full.yaml#/sync-activity-logs"

components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
      example: 1
    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    CursorParam:
      name: cursor
      in: query
      description: Cursor untuk pagination berbasis cursor. Jika tidak diisi, akan mulai dari awal.
      required: false
      schema:
        type: string
      example: "cursor-uuid-1234"
    LimitParam:
      name: limit
      in: query
      description: Jumlah data per page (pagination berbasis cursor)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID dari resource yang dituju.

  schemas:
    # =====================
    # LOGIN REQUEST/RESPONSE
    # =====================
    LoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      properties:
        username:
          type: string
          minLength: 4
        password:
          type: string
          format: password
          minLength: 8
        device_id:
          type: string
          description: UUID unik perangkat yang digunakan login

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT token untuk autentikasi selanjutnya
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        data:
          $ref: "#/components/schemas/UserResponse"

    # =====================
    # USER RESPONSE
    # =====================
    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: ID unik user (UUID atau numeric)
          example: "user-uuid-1234"
        username:
          type: string
          example: "budi_abk1"
        name:
          type: string
          description: Nama lengkap user
          example: "Budi Santoso"
        role:
          $ref: "./components/enums.yaml#/UserRole"
        phone:
          type: string
          description: Nomor HP user
          example: "+628123456789"
        email:
          type: string
          format: email
          example: "budi@andersonfarm.id"
        device_id:
          type: string
          description: UUID perangkat yang terdaftar (jika sudah binding)
          example: "android-uuid-xxx-yyy"
        coop_assignments:
          type: array
          description: Daftar kandang yang diassign ke user (jika ada)
          items:
            type: object
            properties:
              coop_id:
                type: string
                description: ID kandang
                example: "coop-uuid-1234"
              coop_name:
                type: string
                description: Nama kandang
                example: "Kandang A1"
        is_active:
          type: boolean
          description: Status aktif user
          example: true
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-10T12:00:00Z"

    # --- REQUEST SCHEMAS ---
    FcmTokenRequest:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string
          description: Token unik yang dihasilkan oleh Firebase Cloud Messaging di perangkat.
          example: "fcm_token_xyz_123..."
        device_name:
          type: string
          description: Nama opsional perangkat untuk identifikasi log.
          example: "Samsung S24 - Android 14"

    # --- REQUEST SCHEMAS ---
    ForgotPasswordRequest:
      type: object
      required:
        - username
        - via
      properties:
        username:
          type: string
          description: Username user yang ingin reset password
          example: "budi_abk1"
        via:
          type: string
          description: Media pengiriman OTP/link (email/wa)
          enum: [email, wa]
          example: "email"

    ResetPasswordRequest:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum: [old_password, admin_reset, otp]
          description: Metode reset password.
        username:
          type: string
          description: Wajib untuk method old_password.
        current_password:
          type: string
          format: password
          description: Wajib untuk method old_password.
        new_password:
          type: string
          format: password
          minLength: 8
          description: Wajib untuk method old_password dan admin_reset.
        new_password_confirmation:
          type: string
          format: password
          description: Wajib untuk method old_password.
        user_id:
          type: string
          format: uuid
          description: Wajib untuk method admin_reset.

    # --- REQUEST SCHEMAS ---
    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - name
        - role
      properties:
        username:
          type: string
          minLength: 4
          description: Username unik user
          example: "budi_abk1"
        password:
          type: string
          format: password
          minLength: 8
          description: Password user (akan di-hash)
          example: "RahasiaPassword123!"
        name:
          type: string
          description: Nama lengkap user
          example: "Budi Santoso"
        email:
          type: string
          format: email
          description: Email user (opsional)
          example: "budi@andersonfarm.id"
        phone:
          type: string
          description: Nomor HP user (opsional)
          example: "+628123456789"
        role:
          $ref: "./components/enums.yaml#/UserRole"

    # --- FARM SPECIFIC ---
    FarmBase:
      type: object
      required: [area_id, name, address]
      properties:
        area_id:
          type: string
          format: uuid
          description: ID Area induk farm ini.
        name:
          type: string
          example: "Farm Bandung Selatan"
        address:
          type: string
          example: "Jl. Raya Soreang No. 1, Bandung"
        is_active:
          type: boolean
          default: true
          example: true

    # Skema untuk Request (Metadata Client + Data Farm)
    FarmRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/FarmBase"

    # Skema untuk Response (Metadata Server + Data Farm + Metadata Client)
    FarmResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/FarmRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

    UserListData:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "user-uuid-1234"
              username:
                type: string
                example: "budi_abk1"
              name:
                type: string
                example: "Budi Santoso"
              role:
                $ref: "./components/enums.yaml#/UserRole"
              email:
                type: string
                format: email
                example: "budi@andersonfarm.id"
              phone:
                type: string
                example: "+628123456789"
              is_active:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: "2024-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-10T12:00:00Z"

    UserListResponse:
      type: object
      description: Response daftar user dengan dukungan pagination page/limit atau cursor.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Daftar user berhasil diambil."
        data:
          allOf:
            - $ref: "#/components/schemas/UserListData"
            - oneOf:
                - $ref: "./components/response.yaml#/PaginationMetaPage"
                - $ref: "./components/response.yaml#/PaginationMetaCursor"

    # --- AREA SPECIFIC ---
    AreaBase:
      type: object
      required: [name, manager_id]
      properties:
        name:
          type: string
          example: "Area Jawa Barat"
        manager_id:
          type: string
          format: uuid
          description: ID User dengan role Manager.

    # Skema untuk Request (Metadata Client + Data Area)
    AreaRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/AreaBase"

    # Skema untuk Response (Metadata Server + Data Area + Metadata Client)
    AreaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/AreaRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

    # --- COOP SPECIFIC ---
    CoopBase:
      type: object
      required: [farm_id, name, capacity, floor, coop_type]
      properties:
        farm_id:
          type: string
          format: uuid
          description: ID Farm induk kandang ini.
        name:
          type: string
          example: "Kandang A1"
        capacity:
          type: integer
          example: 10000
        floor:
          type: integer
          example: 1
        coop_type:
          $ref: "./components/enums.yaml#/CoopType"
        note:
          oneOf:
            - type: string
            - type: "null"
          example: "Kandang utama untuk starter"
        is_active:
          type: boolean
          default: true
          example: true

    CoopRequest:
      allOf:
        - $ref: "./components/general.yaml#/OfflineMetadataRequest"
        - $ref: "#/components/schemas/CoopBase"

    CoopResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/CoopRequest"
            - $ref: "./components/general.yaml#/OfflineMetadataResponse"

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - ApiKey: []
