coop-documents:
  get:
    tags: [Setup - Coop Document]
    summary: Daftar dokumen SOP kandang
    description: Mengambil seluruh dokumen SOP/Panduan yang terdaftar pada kandang.
    security:
      - sanctum: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: UUID kandang (coop).
    responses:
      "200":
        description: Daftar dokumen berhasil dimuat.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  type: array
                  items:
                    $ref: "../components/documents.yaml#/CoopDocumentResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"

  post:
    tags: [Setup - Coop Document]
    summary: Simpan dokumen SOP kandang
    description: Menyimpan dokumen SOP/Panduan fisik kandang (upload atau URL).
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/documents.yaml#/CoopDocumentRequest"
    responses:
      "201":
        description: Dokumen berhasil disimpan
        content:
          application/json:
            schema:
              $ref: "../components/documents.yaml#/CoopDocumentResponse"
      "400":
        $ref: "../components/response.yaml#/ValidationError"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"

coop-document-single:
  delete:
    tags: [Setup - Coop Document]
    summary: Hapus dokumen SOP kandang
    description: Soft delete dokumen SOP/Panduan dari kandang.
    security:
      - sanctum: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: UUID kandang (coop).
      - in: path
        name: document_id
        required: true
        schema:
          type: string
          format: uuid
        description: UUID dokumen yang akan dihapus.
    responses:
      "200":
        $ref: "../components/response.yaml#/GeneralResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"
