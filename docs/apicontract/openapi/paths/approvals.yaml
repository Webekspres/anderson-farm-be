daily-activities:
  get:
    tags: [Approval]
    summary: Daftar laporan harian menunggu approval
    description: Hanya Manager atau Admin yang dapat mengakses daftar laporan harian yang menunggu persetujuan.
    security:
      - sanctum: []
    parameters:
      - in: query
        name: period_id
        schema:
          type: string
          format: uuid
        description: Filter berdasarkan periode produksi.
      - in: query
        name: coop_id
        schema:
          type: string
          format: uuid
        description: Filter berdasarkan kandang.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Filter tanggal awal.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Filter tanggal akhir.
      - in: query
        name: business_status
        schema:
          type: string
        description: Filter status bisnis. Default `submitted`.
      - in: query
        name: per_page
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Jumlah data per halaman.
    responses:
      "200":
        description: Daftar laporan menunggu approval berhasil diambil.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/DailyActivityApprovalListResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"

daily-activity-single:
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: UUID laporan harian (daily activity header).
  get:
    tags: [Approval]
    summary: Detail laporan harian untuk approval
    security:
      - sanctum: []
    responses:
      "200":
        description: Detail laporan harian berhasil diambil.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/DailyActivityApprovalResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"

  post:
    tags: [Approval]
    summary: Proses approval laporan harian
    description: Manager atau Admin menyetujui atau menolak laporan harian.
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/DailyActivityApprovalReviewRequest"
    responses:
      "200":
        description: Laporan harian berhasil diproses.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/DailyActivityApprovalResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"
      "422":
        $ref: "../components/response.yaml#/ValidationError"
