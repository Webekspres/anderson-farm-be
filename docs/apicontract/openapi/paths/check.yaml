health:
  get:
    tags: [System]
    summary: Health check API
    description: Endpoint publik untuk memverifikasi bahwa server API berjalan.
    security: []
    responses:
      "200":
        description: API berjalan dengan baik.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: API Anderson Farm berjalan dengan baik!
                data:
                  type: object
                  properties:
                    server_time:
                      type: string
                      format: date-time
                    version:
                      type: string
                      example: "1.0.0"
