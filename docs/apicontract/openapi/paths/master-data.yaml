# Master Data CRUD - Areas, Farms, Coops
areas:
  get:
    tags: [Master Data]
    summary: Daftar area (paginasi)
    parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Cari berdasarkan nama
      - in: query
        name: page
        schema:
          type: integer
        description: Halaman (pagination page/limit)
      - in: query
        name: per_page
        schema:
          type: integer
        description: Jumlah per halaman
      - in: query
        name: cursor
        schema:
          type: string
        description: Cursor (cursor pagination)
      - in: query
        name: limit
        schema:
          type: integer
        description: Limit (cursor pagination)
    responses:
      "200":
        description: Daftar area berhasil diambil
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "../components/schemas.yaml#/AreaResponse"
                    total:
                      type: integer
                    per_page:
                      type: integer
                    current_page:
                      type: integer
                    last_page:
                      type: integer

  post:
    tags: [Master Data]
    summary: Buat area baru
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AreaRequest"
    responses:
      "201":
        description: Area berhasil dibuat
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  $ref: "../components/schemas.yaml#/AreaResponse"
      "422":
        description: Validasi gagal

areaSingle:
  get:
    tags: [Master Data]
    summary: Ambil detail area
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Detail area berhasil diambil
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: "../components/schemas.yaml#/AreaResponse"
      "404":
        description: Area tidak ditemukan

  patch:
    tags: [Master Data]
    summary: Edit area
    security:
      - sanctum: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AreaRequest"
    responses:
      "200":
        description: Area berhasil diupdate
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  $ref: "../components/schemas.yaml#/AreaResponse"
      "404":
        description: Area tidak ditemukan

  delete:
    tags: [Master Data]
    summary: Hapus area
    security:
      - sanctum: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Area berhasil dihapus
        content:
          application/json:
            schema:
              $ref: "../components/general.yaml#/GeneralResponse"
      "404":
        description: Area tidak ditemukan

