coops:
  post:
    tags: [Master]
    summary: Tambah kandang
    description: Tambah bangunan fisik kandang.
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CoopRequest"
          example:
            id: "coop-uuid-1234"
            farm_id: "farm-uuid-5678"
            name: "Kandang A1"
            capacity: 10000
            floor: 1
            coop_type: "open_house"
            note: "Kandang utama untuk starter"
            is_active: true
            created_at_client: "2024-01-01T12:00:00Z"
            updated_at_client: "2024-01-10T12:00:00Z"
    responses:
      "201":
        description: Kandang berhasil dibuat
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CoopResponse"
            example:
              success: true
              data:
                id: "coop-uuid-1234"
                farm_id: "farm-uuid-5678"
                name: "Kandang A1"
                capacity: 10000
                floor: 1
                coop_type: "open_house"
                note: "Kandang utama untuk starter"
                is_active: true
                created_at_client: "2024-01-01T12:00:00Z"
                updated_at_client: "2024-01-10T12:00:00Z"
                server_id: 1
                version: 1
                sync_status: "SYNCED"
                created_at_server: "2024-01-01T12:00:00Z"
                updated_at_server: "2024-01-10T12:00:00Z"
                deleted_at: null
      "400":
        description: Validasi gagal (input tidak valid)
        content:
          application/json:
            schema:
              $ref: "../components/general.yaml#/ValidationErrorResponse"
            example:
              success: false
              message: "Input tidak valid."
              errors:
                name:
                  - "Nama kandang wajib diisi."
      "401":
        description: Unauthenticated
        content:
          application/json:
            schema:
              $ref: "../components/general.yaml#/ValidationErrorResponse"
            example:
              success: false
              message: "Token tidak valid."
              errors: {}
      "403":
        description: Forbidden (tidak punya akses)
        content:
          application/json:
            schema:
              $ref: "../components/general.yaml#/ValidationErrorResponse"
            example:
              success: false
              message: "Anda tidak punya akses."
              errors: {}

