report-templates:
  post:
    tags: [Master - Report Template]
    summary: Tambah Template Laporan
    description: Mendaftarkan template auto-teks laporan WhatsApp baru.
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/master-setup.yaml#/ReportTemplateRequest"
    responses:
      "201":
        description: Template laporan berhasil dibuat
        content:
          application/json:
            schema:
              $ref: "../components/master-setup.yaml#/ReportTemplateResponse"
      "400":
        $ref: "../components/response.yaml#/ValidationError"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"

single-report-templates:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ResourceId"
  put:
    tags: [Master - Report Template]
    summary: Edit Template Laporan
    description: Mengubah data template auto-teks laporan WhatsApp.
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/master-setup.yaml#/ReportTemplateRequest"
    responses:
      "200":
        description: Template laporan berhasil diupdate
        content:
          application/json:
            schema:
              $ref: "../components/master-setup.yaml#/ReportTemplateResponse"
      "400":
        $ref: "../components/response.yaml#/ValidationError"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"
  delete:
    tags: [Master - Report Template]
    summary: Hapus Template Laporan
    description: Menghapus (soft-delete) template auto-teks laporan WhatsApp.
    security:
      - sanctum: []
    responses:
      "200":
        $ref: "../components/general.yaml#/GeneralResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "403":
        $ref: "../components/response.yaml#/ForbiddenError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"
