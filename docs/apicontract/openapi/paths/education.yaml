# ==========================================
# EDUCATION ARTICLES
# ==========================================
education-articles:
  post:
    tags: [Master - Education Article]
    summary: Tambah Artikel Edukasi
    description: Mendaftarkan artikel panduan/edukasi baru.
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/education.yaml#/EducationArticleRequest"
    responses:
      "201":
        description: Artikel edukasi berhasil dibuat
        content:
          application/json:
            schema:
              $ref: "../components/education.yaml#/EducationArticleResponse"
      "400":
        $ref: "../components/response.yaml#/ValidationError"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"

single-education-articles:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ResourceId"
  put:
    tags: [Master - Education Article]
    summary: Edit Artikel Edukasi
    description: Mengubah data artikel panduan/edukasi.
    security:
      - sanctum: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/education.yaml#/EducationArticleRequest"
    responses:
      "200":
        description: Artikel edukasi berhasil diupdate
        content:
          application/json:
            schema:
              $ref: "../components/education.yaml#/EducationArticleResponse"
      "400":
        $ref: "../components/response.yaml#/ValidationError"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"
  delete:
    tags: [Master - Education Article]
    summary: Hapus Artikel Edukasi
    description: Menghapus (soft-delete) artikel panduan/edukasi.
    security:
      - sanctum: []
    responses:
      "200":
        $ref: "../components/response.yaml#/GeneralResponse"
      "401":
        $ref: "../components/response.yaml#/UnauthorizedError"
      "404":
        $ref: "../components/response.yaml#/NotFoundError"

