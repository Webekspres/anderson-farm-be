      responses:
        '200':
          description: Berhasil mendapatkan info versi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckVersionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/notifications:
    get:
      tags:
        - System - Notifications
      summary: Daftar notifikasi user
      description: |
        Menarik riwayat pesan masuk (Inbox) milik user yang sedang login.
        Mendukung paginasi untuk efisiensi sinkronisasi.
      security:
        - sanctum: []
      responses:
        '200':
          description: Berhasil mengambil daftar notifikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/notifications/read-all:
    patch:
      tags:
        - System - Notifications
      summary: Tandai semua notifikasi dibaca
      description: Mass update untuk menandai seluruh notifikasi unread milik user sesi aktif sebagai sudah dibaca.
      security:
        - sanctum: []
      responses:
        '200':
          description: Semua notifikasi berhasil ditandai sebagai dibaca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/notifications/{id}/read:
    patch:
      tags:
        - System - Notifications
      summary: Tandai notifikasi dibaca
      description: |
        Mengubah status 'read_at' pada notifikasi spesifik.
        Menggunakan PATCH karena hanya melakukan update parsial pada satu kolom.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Notifikasi berhasil ditandai sebagai dibaca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/sync/master-data:
    get:
      tags:
        - Sync
      summary: Download master data (cache)
      description: |
        Mengunduh cache referensi dasar untuk operasional offline.
        Termasuk daftar ovk_items, form_configs, dan coop_documents.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: last_sync_timestamp
          schema:
            type: string
            format: date-time
          description: Timestamp sinkronisasi terakhir untuk delta sync
      responses:
        '200':
          description: Master data berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  current_server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      areas:
                        type: array
                        items:
                          $ref: '#/components/schemas/AreaResponse-2'
                      farms:
                        type: array
                        items:
                          $ref: '#/components/schemas/FarmResponse-2'
                      coops:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoopResponse-2'
                      form_configs:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormConfigResponse-2'
                      ovk_items:
                        type: array
                        items:
                          type: object
  /api/v1/sync/periods:
    get:
      tags:
        - Sync
      summary: Pull periode aktif
      description: |
        Mengunduh detail periode aktif beserta relasi investor, dokumen,
        dan kontrak untuk ditampilkan di mobile.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: last_sync_timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Data periode berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  current_server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      periods:
                        type: array
                        items:
                          type: object
    post:
      tags:
        - Sync
      summary: Push penerimaan kontrak
      description: |
        Mengirim jejak persetujuan digital (signature) kontrak bagi hasil
        dari ABK ke server. Hanya untuk response kontrak saja.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contract_acceptances
              properties:
                contract_acceptances:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - contract_id
                      - signature_data
                    properties:
                      id:
                        type: string
                        format: uuid
                      contract_id:
                        type: string
                        format: uuid
                      signature_data:
                        type: string
                        description: Base64 encoded signature
                      timestamp:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Penerimaan kontrak berhasil disinkronkan
  /api/v1/sync/daily-activities:
    get:
      tags:
        - Sync
      summary: Pull aktivitas harian (beban terberat)
      description: |
        Mengunduh data aktivitas harian beserta relasi:
        - HBE (Health Behavior Evaluation)
        - Panen (Harvest)
        - OVK Usage
        - Foto Evidensi
        - Checklist harian
      security:
        - sanctum: []
      parameters:
        - in: query
          name: period_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: last_sync_timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Data aktivitas harian berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  current_server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: array
                    items:
                      type: object
                      description: Daily activity header dengan child records
    post:
      tags:
        - Sync
      summary: Push aktivitas harian (bulk sync)
      description: |
        Mengirim bulk sync dari mobile. Mendukung wipe & replace strategy
        untuk anak records dan conflict detection untuk header.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - headers
              properties:
                headers:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - period_id
                      - user_id
                      - date
                    properties:
                      id:
                        type: string
                        format: uuid
                      period_id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      date:
                        type: string
                        format: date
                      mortality_count:
                        type: integer
                      feed_consumption_kg:
                        type: number
                        format: float
                      dynamic_logs:
                        type: array
                        items:
                          type: object
                      harvests:
                        type: array
                        items:
                          type: object
                      ovk_usages:
                        type: array
                        items:
                          type: object
                      photos:
                        type: array
                        items:
                          type: object
                      daily_checklist_logs:
                        type: array
                        items:
                          type: object
      responses:
        '200':
          description: Aktivitas harian berhasil disinkronkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      sync_results:
                        type: array
                        items:
                          $ref: '#/components/schemas/SyncResult'
  /api/v1/sync/finances:
    get:
      tags:
        - Sync
      summary: Pull data keuangan (transaksi & gaji)
      description: |
        Mengunduh delta transaksi pengeluaran dan status gaji.
        - Role ABK: hanya gaji pribadi
        - Role PIC/Manager/Admin: semua transaksi dan gaji
      security:
        - sanctum: []
      parameters:
        - in: query
          name: last_sync_timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Data keuangan berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  current_server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          type: object
                      employee_salaries:
                        type: array
                        items:
                          type: object
    post:
      tags:
        - Sync
      summary: Push transaksi pengeluaran
      description: |
        Mengirim bulk transaksi pengeluaran (kas kecil) dari SQLite ke server.
        Hanya role PIC, Manager, dan Admin yang diizinkan.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transactions
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - period_id
                      - type
                      - amount
                    properties:
                      id:
                        type: string
                        format: uuid
                      period_id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum:
                          - INCOME
                          - EXPENSE
                      category_id:
                        type: string
                        format: uuid
                      amount:
                        type: number
                      description:
                        type: string
                      business_status:
                        type: string
                        enum:
                          - PENDING
                          - APPROVED
                          - REJECTED
                      receipt_image_path_local:
                        type: string
                        nullable: true
      responses:
        '200':
          description: Transaksi berhasil disinkronkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sync_results:
                        type: array
                        items:
                          $ref: '#/components/schemas/SyncResult'
  /api/v1/sync/maintenances:
    get:
      tags:
        - Sync
      summary: Pull laporan maintenance
      description: |
        Mengunduh delta laporan pemeliharaan fasilitas.
        Admin: semua log | User lain: hanya dari coop mereka
      security:
        - sanctum: []
      parameters:
        - in: query
          name: last_sync_timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Data maintenance berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  current_server_timestamp:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      maintenance_logs:
                        type: array
                        items:
                          type: object
    post:
      tags:
        - Sync
      summary: Push laporan maintenance
      description: |
        Mengirim laporan kerusakan dan status pemeliharaan fasilitas.
        ABK bisa buat laporan baru; PIC/Manager/Admin bisa update status.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - maintenances
              properties:
                maintenances:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Laporan maintenance berhasil disinkronkan
  /api/v1/sync/rhpps:
    get:
      tags:
        - Sync
      summary: Pull RHPP final (read-only)
      description: |
        Mengunduh rekap laba bersih akhir periode dan dokumen PDF-nya.
        Data hanya-baca untuk ditampilkan kepada ABK/PIC.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: last_sync_timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Data RHPP berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
  /api/v1/sync/education:
    get:
      tags:
        - Sync
      summary: Pull artikel edukasi & referensi harga
      description: |
        Mengunduh artikel panduan untuk ABK dan referensi harga komoditas
        untuk operasional offline.
      security:
        - sanctum: []
      responses:
        '200':
          description: Data edukasi berhasil diunduh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      articles:
                        type: array
                        items:
                          type: object
                      price_references:
                        type: array
                        items:
                          type: object
  /api/v1/sync/activity-logs:
    post:
      tags:
        - Sync
      summary: Push audit trail aktivitas user
      description: |
        Mengirim rekam jejak (audit trail) tombol aplikasi yang diklik user.
        Push-only endpoint untuk tracking penggunaan aplikasi.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - logs
              properties:
                logs:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - action
                      - timestamp
                    properties:
                      id:
                        type: string
                        format: uuid
                      action:
                        type: string
                        description: Nama tombol/action yang diklik
                        example: open_daily_activity
                      timestamp:
                        type: string
                        format: date-time
                      metadata:
                        type: object
                        nullable: true
      responses:
        '201':
          description: Audit trail berhasil dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
components:
  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
      example: 1
    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman (pagination berbasis page/limit)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    CursorParam:
      name: cursor
      in: query
      description: Cursor untuk pagination berbasis cursor. Jika tidak diisi, akan mulai dari awal.
      required: false
      schema:
        type: string
      example: cursor-uuid-1234
    LimitParam:
      name: limit
      in: query
      description: Jumlah data per page (pagination berbasis cursor)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID dari resource yang dituju.
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      properties:
        username:
          type: string
          minLength: 4
        password:
          type: string
          format: password
          minLength: 8
        device_id:
          type: string
          description: UUID unik perangkat yang digunakan login
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT token untuk autentikasi selanjutnya
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        data:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: ID unik user (UUID atau numeric)
          example: user-uuid-1234
        username:
          type: string
          example: budi_abk1
        name:
          type: string
          description: Nama lengkap user
          example: Budi Santoso
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          type: string
          description: Nomor HP user
          example: '+628123456789'
        email:
          type: string
          format: email
          example: budi@andersonfarm.id
        device_id:
          type: string
          description: UUID perangkat yang terdaftar (jika sudah binding)
          example: android-uuid-xxx-yyy
        coop_assignments:
          type: array
          description: Daftar kandang yang diassign ke user (jika ada)
          items:
            type: object
            properties:
              coop_id:
                type: string
                description: ID kandang
                example: coop-uuid-1234
              coop_name:
                type: string
                description: Nama kandang
                example: Kandang A1
        is_active:
          type: boolean
          description: Status aktif user
          example: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-10T12:00:00Z'
    FcmTokenRequest:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string
          description: Token unik yang dihasilkan oleh Firebase Cloud Messaging di perangkat.
          example: fcm_token_xyz_123...
        device_name:
          type: string
          description: Nama opsional perangkat untuk identifikasi log.
          example: Samsung S24 - Android 14
    ForgotPasswordRequest:
      type: object
      required:
        - username
        - via
      properties:
        username:
          type: string
          description: Username user yang ingin reset password
          example: budi_abk1
        via:
          type: string
          description: Media pengiriman OTP/link (email/wa)
          enum:
            - email
            - wa
          example: email
    ResetPasswordRequest:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - old_password
            - admin_reset
            - otp
          description: Metode reset password.
        username:
          type: string
          description: Wajib untuk method old_password.
        current_password:
          type: string
          format: password
          description: Wajib untuk method old_password.
        new_password:
          type: string
          format: password
          minLength: 8
          description: Wajib untuk method old_password dan admin_reset.
        new_password_confirmation:
          type: string
          format: password
          description: Wajib untuk method old_password.
        user_id:
          type: string
          format: uuid
          description: Wajib untuk method admin_reset.
    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - name
        - role
      properties:
        username:
          type: string
          minLength: 4
          description: Username unik user
          example: budi_abk1
        password:
          type: string
          format: password
          minLength: 8
          description: Password user (akan di-hash)
          example: RahasiaPassword123!
        name:
          type: string
          description: Nama lengkap user
          example: Budi Santoso
        email:
          type: string
          format: email
          description: Email user (opsional)
          example: budi@andersonfarm.id
        phone:
          type: string
          description: Nomor HP user (opsional)
          example: '+628123456789'
        role:
          $ref: '#/components/schemas/UserRole'
    FarmBase:
      type: object
      required:
        - area_id
        - name
        - address
      properties:
        area_id:
          type: string
          format: uuid
          description: ID Area induk farm ini.
        name:
          type: string
          example: Farm Bandung Selatan
        address:
          type: string
          example: Jl. Raya Soreang No. 1, Bandung
        is_active:
          type: boolean
          default: true
          example: true
    FarmRequest:
      allOf:
        - $ref: '#/components/schemas/OfflineMetadataRequest'
        - $ref: '#/components/schemas/FarmBase'
    FarmResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/FarmRequest'
            - $ref: '#/components/schemas/OfflineMetadataResponse'
    UserListData:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: user-uuid-1234
              username:
                type: string
                example: budi_abk1
              name:
                type: string
                example: Budi Santoso
              role:
                $ref: '#/components/schemas/UserRole'
              email:
                type: string
                format: email
                example: budi@andersonfarm.id
              phone:
                type: string
                example: '+628123456789'
              is_active:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: '2024-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-10T12:00:00Z'
    UserListResponse:
      type: object
      description: Response daftar user dengan dukungan pagination page/limit atau cursor.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Daftar user berhasil diambil.
        data:
          allOf:
            - $ref: '#/components/schemas/UserListData'
            - oneOf:
                - $ref: '#/components/schemas/PaginationMetaPage'
                - $ref: '#/components/schemas/PaginationMetaCursor'
    AreaBase:
      type: object
      required:
        - name
        - manager_id
      properties:
        name:
          type: string
          example: Area Jawa Barat
        manager_id:
          type: string
          format: uuid
          description: ID User dengan role Manager.
    AreaRequest:
      allOf:
        - $ref: '#/components/schemas/OfflineMetadataRequest'
        - $ref: '#/components/schemas/AreaBase'
    AreaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/AreaRequest'
            - $ref: '#/components/schemas/OfflineMetadataResponse'
    CoopBase:
      type: object
      required:
        - farm_id
        - name
        - capacity
        - floor
        - coop_type
      properties:
        farm_id:
          type: string
          format: uuid
          description: ID Farm induk kandang ini.
        name:
          type: string
          example: Kandang A1
        capacity:
          type: integer
          example: 10000
        floor:
          type: integer
          example: 1
        coop_type:
          $ref: '#/components/schemas/CoopType'
        note:
          oneOf:
            - type: string
            - type: 'null'
          example: Kandang utama untuk starter
        is_active:
          type: boolean
          default: true
          example: true
    CoopRequest:
      allOf:
        - $ref: '#/components/schemas/OfflineMetadataRequest'
        - $ref: '#/components/schemas/CoopBase'
    CoopResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/CoopRequest'
            - $ref: '#/components/schemas/OfflineMetadataResponse'
    UserRole:
      type: string
      enum:
        - admin
        - finance
        - manager
        - pic
        - abk
        - investor
    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            username:
              - The username has already been taken.
    GeneralResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
          description: Field tambahan jika diperlukan di masa depan. Bisa berupa objek atau null.
    PaginationMetaPage:
      type: object
      description: Metadata untuk pagination berbasis page/limit
      properties:
        total:
          type: integer
          example: 2
        per_page:
