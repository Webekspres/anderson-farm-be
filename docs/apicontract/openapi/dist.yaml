        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor (cursor pagination)
        - in: query
          name: limit
          schema:
            type: integer
          description: Limit (cursor pagination)
      responses:
        '200':
          description: Daftar area berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AreaResponse-2'
                      total:
                        type: integer
                      per_page:
                        type: integer
                      current_page:
                        type: integer
                      last_page:
                        type: integer
    post:
      tags:
        - Master Data
      summary: Buat area baru
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaRequest-2'
      responses:
        '201':
          description: Area berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AreaResponse-2'
        '422':
          description: Validasi gagal
  /api/v1/areas/{id}:
