          type: string
        data:
          $ref: '#/components/schemas/DailyActivityHeader'
    DailyActivityApprovalReviewRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - approve
            - reject
        rejection_reason:
          type: string
          maxLength: 1000
          description: Wajib diisi jika action adalah reject.
    CheckVersionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            latest_version:
