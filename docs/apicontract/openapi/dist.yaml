  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Token tidak valid atau kadaluarsa.
            errors: {}
    ForbiddenError:
      description: Forbidden (tidak punya akses role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Anda tidak memiliki hak akses.
            errors: {}
    ValidationError:
      description: Validasi gagal (input tidak valid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Input tidak valid.
            errors:
              name:
                - Field ini wajib diisi.
    NotFoundError:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Data tidak ditemukan di sistem.
            errors: {}
    GeneralResponse:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralResponse'
    PayloadTooLargeError:
      description: Ukuran file melebihi batas maksimum
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Ukuran file terlalu besar. Maksimum 5MB.
            errors:
              file:
                - File size exceeds the 5MB limit.
