openapi: 3.1.0
info:
  version: 1.0.0
  title: Anderson Farm API
  description: API sistem manajemen pertanian offline-first untuk Anderson Farm
security:
  - ApiKey: []
paths:
  /api/check:
    get:
      tags:
        - System
      summary: Health check API
      description: Endpoint publik untuk memverifikasi bahwa server API berjalan.
      security: []
      responses:
        '200':
          description: API berjalan dengan baik.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API Anderson Farm berjalan dengan baik!
                  data:
                    type: object
                    properties:
                      server_time:
                        type: string
                        format: date-time
                      version:
                        type: string
                        example: 1.0.0
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login & Device Binding.
      description: Login dan mengunci akun ke 1 perangkat (device binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: budi_abk1
              password: RahasiaPassword123!
              device_id: android-uuid-xxx-yyy
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Login gagal (username/password/device salah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Cek sesi aktif user
      description: Cek sesi aktif & tarik hak akses (role & coop_assignments).
      responses:
        '200':
          description: Data user aktif & hak akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                phone: '+628123456789'
                email: budi@andersonfarm.id
                device_id: android-uuid-xxx-yyy
                coop_assignments:
                  - coop_id: coop-uuid-1234
                    coop_name: Kandang A1
                  - coop_id: coop-uuid-5678
                    coop_name: Kandang B2
                is_active: true
                created_at: '2024-01-01T12:00:00Z'
                updated_at: '2024-01-10T12:00:00Z'
        '401':
          description: Tidak ada sesi aktif / token tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Token tidak valid atau sesi sudah berakhir.
                errors: {}
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Menghapus (revoke) token dari server untuk mengakhiri sesi.
      security:
        - sanctum: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
        '401':
          description: Unauthenticated (Token tidak valid atau sudah kadaluarsa)
  /api/v1/auth/fcm-token:
    post:
      tags:
        - Auth
      summary: Simpan token FCM
      description: Simpan token Firebase untuk menerima Push Notification pada perangkat yang sedang digunakan.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
      responses:
        '200':
          description: Token berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
        '422':
          description: Validasi gagal (misal token kosong atau format salah)
  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: |
        Endpoint untuk reset password dengan beberapa metode:
        - `old_password`: User mengganti password sendiri (wajib username + current_password + new_password).
        - `admin_reset`: Admin mereset password user lain (wajib Bearer token admin + user_id + new_password).
        - `otp`: Belum tersedia (akan mengembalikan 422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - method
                    - username
                    - current_password
                    - new_password
                    - new_password_confirmation
                  properties:
                    method:
                      type: string
                      enum:
                        - old_password
                    username:
                      type: string
                    current_password:
                      type: string
                      format: password
                    new_password:
                      type: string
                      format: password
                      minLength: 8
                    new_password_confirmation:
                      type: string
                      format: password
                - type: object
                  required:
                    - method
                    - user_id
                    - new_password
                  properties:
                    method:
                      type: string
                      enum:
                        - admin_reset
                    user_id:
                      type: string
                      format: uuid
                    new_password:
                      type: string
                      format: password
                      minLength: 8
                - type: object
                  required:
                    - method
                  properties:
                    method:
                      type: string
                      enum:
                        - otp
      responses:
        '200':
          description: Password berhasil direset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
        '401':
          description: Kredensial salah atau unauthenticated (admin_reset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Akun dinonaktifkan atau bukan admin (admin_reset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Validasi gagal atau metode OTP belum tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Daftar pengguna (paginasi)
      description: Tarik daftar pekerja (paginasi).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian username/nama/email
      responses:
        '200':
          description: Daftar user dengan paginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                success: true
                message: Daftar user berhasil diambil.
                data:
                  total: 2
                  per_page: 10
                  current_page: 1
                  last_page: 1
                  users:
                    - id: user-uuid-1234
                      username: budi_abk1
                      name: Budi Santoso
                      role: abk
                      email: budi@andersonfarm.id
                      phone: '+628123456789'
                      is_active: true
                      created_at: '2024-01-01T12:00:00Z'
                      updated_at: '2024-01-10T12:00:00Z'
                    - id: user-uuid-5678
                      username: sari_manager
                      name: Sari Dewi
                      role: manager
                      email: sari@andersonfarm.id
                      phone: '+628987654321'
                      is_active: true
                      created_at: '2024-01-02T12:00:00Z'
                      updated_at: '2024-01-11T12:00:00Z'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Token tidak valid.
                errors: {}
    post:
      tags:
        - Users
      summary: Buat pengguna baru
      description: |
        Buat pekerja baru. Endpoint ini hanya dapat diakses oleh user dengan role admin.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              username: budi_abk1
              password: RahasiaPassword123!
              name: Budi Santoso
              email: budi@andersonfarm.id
              phone: '+628123456789'
              role: abk
      responses:
        '201':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                email: budi@andersonfarm.id
                phone: '+628123456789'
                is_active: true
                created_at: '2024-01-01T12:00:00Z'
                updated_at: '2024-01-10T12:00:00Z'
        '400':
          description: Username/email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Username/email sudah terdaftar.
                errors:
                  username:
                    - Username sudah digunakan.
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Input tidak valid.
                errors:
                  password:
                    - Password minimal 8 karakter.
  /api/v1/users/{id}:
    patch:
      tags:
        - Users
      summary: Edit profil pekerja
      description: |
        Edit data profil pekerja (parsial atau keseluruhan). Hanya dapat diakses oleh admin dan manager.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nama lengkap user
                  example: Budi Santoso
                email:
                  type: string
                  format: email
                  description: Email user (opsional)
                  example: budi@andersonfarm.id
                phone:
                  type: string
                  description: Nomor HP user (opsional)
                  example: '+628123456789'
                device_id:
                  type: string
                  description: UUID perangkat (opsional, untuk reset/unbind)
                  example: null
            example:
              name: Budi Santoso
              device_id: null
      responses:
        '200':
          description: Profil pekerja berhasil diupdate (parsial)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: user-uuid-1234
                username: budi_abk1
                name: Budi Santoso
                role: abk
                email: budi@andersonfarm.id
                phone: '+628123456789'
                is_active: true
                created_at: '2024-01-01T12:00:00Z'
                updated_at: '2024-01-10T12:00:00Z'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
        '403':
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
    delete:
      tags:
        - Users
      summary: Hapus akun pekerja (soft-delete)
      description: |
        Hapus akun pekerja (soft-delete). Hanya dapat diakses oleh admin.
      security:
        - sanctum: []
      responses:
        '200':
          description: Akun pekerja berhasil dihapus (soft-delete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralResponse'
              example:
                success: true
                message: Akun pekerja berhasil dihapus.
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
        '403':
          description: Forbidden (tidak punya akses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
  /api/v1/areas:
