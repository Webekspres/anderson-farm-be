  /api/v1/coop-floors:
    get:
      tags:
        - Master Data
      summary: Daftar lantai kandang
      description: Mengambil daftar lantai kandang dengan dukungan filter dan paginasi.
      security:
        - sanctum: []
      parameters:
        - in: query
          name: coop_id
          schema:
            type: string
            format: uuid
          description: Filter berdasarkan ID kandang.
        - in: query
          name: search
          schema:
            type: string
          description: Cari berdasarkan nama lantai.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Daftar lantai kandang berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoopFloorListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Master Data
      summary: Buat lantai kandang baru
      description: Hanya admin yang dapat membuat lantai kandang baru.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoopFloorRequest'
      responses:
        '201':
          description: Lantai kandang berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoopFloorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/coop-floors/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Master Data
      summary: Detail lantai kandang
      security:
        - sanctum: []
      responses:
        '200':
          description: Detail lantai kandang berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoopFloorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
